    · 반대쪽을 가로질러 닦을 땐 손잡이 기울기를 줄여 입 밖으로 자연스럽게 나가게

    · 칫솔 손잡이가 항상 양치하는 손 쪽에서 들어옴 (거울 기준: 오른손 = 화면 오른쪽)
      반대쪽 이빨을 닦을 땐 손잡이가 입을 가로질러 나옴
    · 안쪽 닦기에서 손잡이가 앞니 뒤로 지나가도록 같은 줄 이빨을 앞에 겹쳐 그림
    · 부모님 설정 > 양치하는 손: 오른손 / 왼손
    · 반짝이는 칫솔 손잡이 반대쪽 아래에 자리
  v0.6.0 - 양치 방법 선택
    · 부모님 설정 > 양치 방법: 짧게 앞뒤로(기본) / 작은 원 그리기(폰즈법) / 쓸어내리기(회전법)
    · 방법마다 칫솔 움직임이 다름
      - 짧게 앞뒤로: 잇몸 쪽에서 잘게 앞뒤로 진동하며 이빨을 따라 천천히 이동
      - 작은 원: 작은 원을 그리며 이동
      - 쓸어내리기: 잇몸에서 이 끝 쪽으로 (윗니는 위→아래, 아랫니는 아래→위)
      - 어금니 씹는 면은 모든 방법에서 앞뒤로 문지르기
    · 양치 화면에 지금 동작 안내 표시 (예: "⬇ 위에서 아래로 쓸어내리기")
    · "마무리 양치는 부모님이 도와주세요" 안내 (설정, 완료 화면)
    · 참고: ADA는 특정 방법 하나를 정답으로 정하지 않음 (잇몸선 45도, 짧고 부드럽게, 모든 면)
  v0.5.4 - 폰에서 화면 깜빡임·목소리 수정
    · 깜빡임 원인: 카메라를 움직일 때마다 입 그림 전체를 매 프레임 다시 그려서, 폰이 다 못 그린 조각이 비어 보였음
      → 그림은 한 번만 그리고, 카메라는 그려진 그림을 미끄러지듯 옮기는 방식(GPU 이동)으로 변경
    · 계속 움직이던 작은 애니메이션(치석 꼬물거림, 이빨 테두리 깜빡임) 제거 → 다시 그리는 양 감소
    · 화면 밖까지 그리던 아주 큰 배경 도형 제거 (배경은 CSS로)
    · 목소리: 음 높이를 원래대로(로봇 같던 소리 개선), 더 자연스러운 목소리 우선 선택
      말하는 중엔 응원 같은 덜 중요한 말은 끊지 않고 건너뜀, 말할 때 배경 음악 작게
  v0.5.3 - C: 앞니에도 더러움 다시 배치 (어금니는 더 많고 크게, 앞니도 빠짐없이)
    · 앞니·송곳니: 잇몸선 치석(작게), 이 사이 음식물(작게)
    · 어금니: 큰 치석, 씹는 면 홈 찌꺼기, 어금니 사이 큰 음식물 (그대로)
  v0.5.2 - C: 어금니 중심으로 재구성
    · 유치 기준 이빨 모양: 한쪽마다 가운데 앞니·옆 앞니·송곳니·첫째 어금니·둘째 어금니 (위아래 각 10개)
    · 어금니는 넓적하게, 씹는 면과 홈(골짜기)이 보이게
    · 더러움을 어금니에 집중: 씹는 면 홈 속 찌꺼기, 어금니 사이 음식물, 어금니·송곳니 잇몸선 치석
      앞니는 거의 깨끗하게 시작
    · 구역마다 시간 배분 변경: 바깥쪽 30% → 어금니 씹는 면 45% → 안쪽 25%
    · 어금니 씹는 면 닦을 땐 칫솔이 어금니로 가고 카메라도 어금니로 다가감
  v0.5.1 - C: 더러운 이빨에서 시작해서 닦아 내기
    · 잇몸 추가 (이빨마다 둥근 잇몸선, 이 사이로 내려오는 잇몸)
    · 잇몸선에 치석(꼬물거리는 노란 덩어리), 이 사이에 음식물(채소·과자·과일 조각), 씹는 면에 부스러기
    · 칫솔이 닦는 면과 맞물려 하나씩 반짝 하며 사라짐
      바깥쪽 → 잇몸선 치석 + 이 사이 음식물 절반 / 씹는 면 → 부스러기 / 안쪽 → 이 사이 음식물 나머지
  v0.5.0 - 양치 화면 C: 클로즈업
    · 화면을 꽉 채운 입 (거울 속 내 입 컨셉), 세로·가로 모두
    · 큰 칫솔이 구역마다 바깥쪽 → 씹는 면 → 안쪽 순서로 각도를 바꿔 이동 (2분 = 4구역 × 3면 × 10초)
    · 안쪽 닦을 땐 칫솔이 이빨 뒤로 들어간 것처럼 보이게 처리
    · 지금 닦는 이빨은 노랗게 빛나고, 다 닦은 이빨은 누런색 → 새하얀색으로 바뀜
    · 닦을수록 거품이 쌓이고, 끝나면 거품이 걷히며 이빨이 반짝 + 카메라가 뒤로 빠지는 끝 연출
    · 카메라가 지금 닦는 쪽을 따라 이동 (세로 화면에선 한쪽씩 크게)
    · 꾸민 반짝이가 화면 아래 칫솔 반대쪽에서 같이 양치하며 응원
    · 위쪽 진행 막대: 시간 말풍선이 막대를 따라 이동, 구역마다 체크 표시
    · 테스트 전환 버튼이 A → B → C 순서로 바뀜
  v0.4.0 - 양치 화면 A/B 비교용
    · A: 입 중심 화면. 거울 속 큰 입 그림 위로 칫솔이 지금 닦을 곳을 쓱쓱, 반짝이는 옆에서 응원
         폰을 세워도 눕혀도 그 방향에 맞게 배치가 바뀜
    · B: 가로 전용 무대 화면 (미미자우르식). 욕실 무대에서 반짝이가 크게 양치, 오른쪽에 입 안내
         세로로 들고 있으면 "가로로 돌려 주세요" 안내 → 돌리면 시작
    · 두 화면 모두 반짝이가 닦는 쪽으로 몸을 기울임, 멀리서도 보이게 글씨·그림 키움
    · 테스트용 A/B 전환 버튼 (첫 화면 아래, 설정 > 개발자 테스트)
    · 언어팩 버전 관리: 받은 언어팩보다 새 버전이 있으면 자동 갱신
  v0.3.1 - 테스트 모드
    · TEST_MODE: 별을 최소 100개 채워 줌 (이미 쓰던 기기도 한 번 채워 줌) → 출시 전 false로
  v0.3.0 - 전 세계 출시 대비 구조
    · 다국어 시스템: 모든 글자를 언어팩(문자열 키)으로 분리, 한국어·영어 내장
    · 언어팩 받기 구조: 日本語 팩을 샘플로 "받기" 흐름 구현 (지금은 파일 안에 든 샘플, 나중엔 서버 주소)
    · 언어팩마다 글꼴, 글 방향(오른쪽→왼쪽 언어 대비), 목소리 언어, 녹음 음성 파일 지정 가능
    · 목소리 응원: 기기의 음성 합성으로 선택한 언어로 응원 (언어팩에 녹음 파일이 있으면 그걸 우선 재생)
    · 사는 나라 설정 + 나라별 이벤트 엔진 (양력 날짜 / 음력 날짜 자동 계산)
    · 이벤트: 새해, 설날, 어린이날, 추석, 핼러윈, 크리스마스
      - 이벤트 기간엔 특별 옷 자동 착용 (아이가 꾸미기에서 바꾸면 그게 우선)
      - 눈, 박쥐, 꽃잎, 별 같은 화면 효과
      - 이벤트 전용 아이템 6종, 이벤트 응원 문구
    · 설정 화면 추가, 개발자 테스트용 이벤트 미리보기
  v0.2.0 - 꾸미기 시스템 (부품 조립식 캐릭터, 아이템 18종, 별로 사기)
  v0.1.0 - 첫 버전 (2분 타이머, 4구역 안내, 효과음, 완료 축하)
  -------------------------------------------
  확장 규칙 요약
    · 아이템 이름: <슬롯>_<종류> (Spine slot/skin 이름과 동일하게 사용)
    · 글자 키: 영역.이름 (예: home.start, say.cheers, item.head_crown)
    · 복수형: 키_one / 키_other (Intl.PluralRules 기준)
    · 한국어 조사: {item|을/를} → 앞 단어 받침에 따라 자동 선택
    · 이벤트 추가: EVENTS 배열에 한 줄 + 언어팩에 event.<id>.name/greet/cheer
  ===========================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  [hidden]{display:none !important}   /* v0.28.2 hidden 표시는 항상 숨김 (칸마다 display 를 정해도 덮어쓰지 않게) */
  /* CSS 안내
     · 색은 :root 변수(--pink, --yellow, --mint …)로 맞춤. 아이용이라 둥근 모서리 · 큰 글씨 · 그림자 0 4px 0 #0001 통일
     · 화면은 .screen 하나만 .active (show(id)로 전환). 양치 화면은 C(클로즈업) 하나 (v0.20.1 부터)
     · 새 기능 CSS는 맨 끝쪽에 버전 이름(v0.19 등) 주석을 단 묶음으로 추가 (어느 버전에서 생겼는지 찾기 쉽게)
     · 움직임은 CSS 애니메이션 위주 (휴대폰에서 가볍게). prefers-reduced-motion 이면 일부 끔 */
  :root{
    --sky1:#8fd3ff; --sky2:#e3f5ff; --ink:#24324a; --title:#1f5f99;
    --pink:#ff7aa8; --pink-d:#e85d8f; --mint:#3ccf9c; --yellow:#ffd54a; --yellow-d:#d9ad1f;
    --card:#ffffffee;
    --font:'Jua';
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font),system-ui,-apple-system,'Apple SD Gothic Neo','Hiragino Maru Gothic ProN','Malgun Gothic',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:manipulation;
    word-break:keep-all;
  }
  button,select{font-family:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}

  /* 배경 구름 */
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  body.brushing .sky,body.brushing #fx{display:none}   /* 양치 중엔 배경 효과를 멈춰 그리기 부담 줄임 */
  .cloud{position:absolute;left:0;background:#fff;border-radius:999px;opacity:.75;animation:drift 45s linear infinite;will-change:transform}
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .c1{width:120px;height:36px;top:7%}
  .c1::before{width:56px;height:56px;left:18px;top:-26px}
  .c1::after{width:40px;height:40px;left:62px;top:-16px}
  .c2{width:90px;height:28px;top:34%;animation-duration:60s;animation-delay:-25s}
  .c2::before{width:42px;height:42px;left:14px;top:-20px}
  .c2::after{width:30px;height:30px;left:46px;top:-12px}
  .c3{width:140px;height:40px;top:66%;animation-duration:75s;animation-delay:-50s;opacity:.55}
  .c3::before{width:64px;height:64px;left:22px;top:-30px}
  .c3::after{width:44px;height:44px;left:76px;top:-18px}
  @keyframes drift{from{transform:translateX(-170px)}to{transform:translateX(110vw)}}

  /* 이벤트 화면 효과 */
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .fxp{position:absolute;top:-40px;animation:fxFall linear forwards;line-height:1}
  @keyframes fxFall{to{transform:translate(var(--dx),calc(100vh + 80px)) rotate(var(--rot))}}
  .fx-snow{border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
  .fx-petal{background:#ffc1d9;border-radius:70% 0 70% 0}
  .fx-star{color:#ffd54a;text-shadow:0 0 6px #fff}
  .fx-balloon{top:auto;bottom:-90px;width:34px;height:42px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;animation-name:fxRise}
  .fx-balloon::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:40px;background:#9aa8bd}
  @keyframes fxRise{to{transform:translate(var(--dx),calc(-100vh - 160px)) rotate(var(--rot))}}

  /* v0.25 가로로 눕힌 폰 (세로 600px 이하): 첫 화면 · 완료 화면을 왼쪽 그림 / 오른쪽 단추 두 칸으로
     의도: 세로 화면 배치를 그대로 쓰면 제목이 잘리고 반짝이가 시간 단추를 가렸음 */
  @media (orientation:landscape) and (max-height:600px){
    #home.screen{max-width:960px}
    #home.screen.active{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;column-gap:20px;align-items:center}
    #home .topbar{grid-column:1 / -1}
    #home .hero{grid-column:1;grid-row:2;height:100%;gap:4px}
    #home h1{font-size:clamp(20px,6.5vh,32px)}
    #home .home-stage{width:min(30vw,46vh,230px)}
    #home .today{font-size:16px;padding:5px 12px}
    #home .event-badge{font-size:15px;padding:4px 12px}
    #home .bottom{grid-column:2;grid-row:2;gap:10px}
    #home .big-btn{font-size:24px;padding:12px}
    #done.screen{max-width:960px}
    #done.screen.active{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;overflow:hidden;align-items:stretch}
    #done .done-l,#done .done-r{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
    #done .done-l{justify-content:center}
    #done .done-r{overflow-y:auto;padding-top:6px}
    #done h2{font-size:clamp(26px,8vh,38px)}
    #done .gift-stage{width:min(34vw,44vh,220px)}
    #done .bottom{bottom:0;padding-bottom:4px}
  }
  .done-l,.done-r{display:contents}                                  /* 세로 화면에선 없는 것처럼 */

  /* 화면 공통 */
  .screen{
    position:fixed;inset:0;max-width:520px;margin:0 auto;
    display:none;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .screen.active{display:flex;animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .topbar .right{display:flex;gap:8px}
  .pill{background:var(--card);padding:8px 16px;border-radius:999px;font-size:20px;box-shadow:0 4px 0 #0001;white-space:nowrap}
  .icon-btn{width:46px;height:46px;border-radius:50%;background:var(--card);font-size:20px;box-shadow:0 4px 0 #0001;flex-shrink:0}
  @media (max-width:375px){                                        /* v0.25 좁은 폰(360px 등): 위쪽 단추가 화면 밖으로 밀리던 것 */
    .topbar{gap:6px} .topbar .right{gap:6px}
    .icon-btn{width:40px;height:40px;font-size:18px}
    #home .pill{padding:7px 11px;font-size:18px}
    #home .tb-left{gap:6px;min-width:0}
    #home .gbar{width:30px}
  }
  .title-sm{font-size:24px;color:var(--title);text-align:center}
  .spacer{width:46px;flex-shrink:0}

  .hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  h1,h2{font-weight:normal;text-align:center;color:var(--title);text-shadow:0 3px 0 #fff,0 6px 14px #fff8;line-height:1.1}
  h1{font-size:clamp(30px,9vw,44px)}
  h2{font-size:clamp(32px,9.5vw,44px)}
  .event-badge{background:#fff;color:#d6336c;padding:6px 14px;border-radius:999px;font-size:17px;box-shadow:0 3px 0 #0001;animation:pop .5s}
  .event-badge[hidden]{display:none}

  .stage{position:relative;width:min(70vw,38vh,320px);aspect-ratio:1/1;display:block;padding:0}
  .home-stage{width:min(60vw,30vh,270px)}
  .closet-stage{width:min(52vw,27vh,240px);flex-shrink:0}
  .char-wrap{position:absolute;inset:4%}
  .brush-stage .char-wrap{inset:13%}
  .char{width:100%;height:100%;overflow:visible;display:block}

  .today,#doneMsg{background:var(--card);padding:8px 16px;border-radius:999px;font-size:19px;text-align:center}
  .parent-tip{font-size:14px;opacity:.7;text-align:center}
  #doneMsg{border-radius:20px;max-width:100%;line-height:1.35}

  .bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
  .chips{display:flex;gap:10px}
  .chip{padding:10px 20px;border-radius:999px;background:var(--card);font-size:20px;box-shadow:0 4px 0 #0001;transition:background .15s}
  .chip.active{background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d)}

  .big-btn{
    width:min(100%,360px);padding:18px;border-radius:28px;background:var(--pink);color:#fff;font-size:30px;
    box-shadow:0 8px 0 var(--pink-d);transition:transform .1s,box-shadow .1s;animation:breathe 2s ease-in-out infinite;
  }
  .big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pink-d)}
  @keyframes breathe{50%{scale:1.03}}
  .sub-btn{padding:12px 24px;border-radius:999px;background:var(--yellow);font-size:21px;box-shadow:0 5px 0 var(--yellow-d)}
  .sub-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-d)}
  .ver{font-size:12px;opacity:.45;padding:2px 10px}
  .test-mode .ver::after{content:' · TEST';font-weight:800;color:#e85d8f}

  /* 톡 튀어나오기 */
  @keyframes pop{0%{scale:.6}70%{scale:1.1}100%{scale:1}}

  /* 캐릭터 애니메이션 */
  .char .body{transform-box:fill-box;transform-origin:50% 100%;animation:float 2.6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .char.brushing .body{animation:wiggle .44s ease-in-out infinite}
  @keyframes wiggle{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
  .char.happy .body{animation:jump .7s ease-in-out infinite}
  .char.cheer .body{animation:jump .6s ease-in-out 1}
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
  .char .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .char .m-open,.char .tool{display:none}
  .char.brushing .m-open,.char.brushing .tool{display:inline}
  .char.brushing .m-smile,.char.brushing .hand-r,.char.brushing [data-slot="hand"]{display:none}
  .char .brush{transform-box:fill-box;transform-origin:center;animation:scrub .22s ease-in-out infinite alternate}
  @keyframes scrub{from{transform:translateX(-8px) rotate(-5deg)}to{transform:translateX(6px) rotate(5deg)}}
  .char .hands circle{transform-box:fill-box;transform-origin:center;animation:handBob 2.6s ease-in-out infinite}
  .char .hands .hand-r{animation-delay:-1.3s}
  @keyframes handBob{50%{transform:translateY(-4px)}}
  .char .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
  @keyframes twinkle{50%{transform:scale(.5) rotate(45deg);opacity:.5}}
  .char .wing-l{transform-box:fill-box;transform-origin:100% 60%;animation:flapL 1.2s ease-in-out infinite}
  .char .wing-r{transform-box:fill-box;transform-origin:0% 60%;animation:flapR 1.2s ease-in-out infinite}
  @keyframes flapL{50%{transform:rotate(12deg)}}
  @keyframes flapR{50%{transform:rotate(-12deg)}}
  .char .flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .22s ease-in-out infinite alternate}
  @keyframes flame{to{transform:scaleY(.55)}}
  .char .spin{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .char .glow{animation:glow 1.4s ease-in-out infinite alternate}
  @keyframes glow{to{opacity:.55}}
  .char.paused .body,.char.paused .brush{animation-play-state:paused}

  .char{transition:transform .45s ease}
  .char.z-ul{transform:rotate(-6deg)}
  .char.z-ur{transform:rotate(6deg)}
  .char.z-ll{transform:rotate(-6deg) translateY(3%)}
  .char.z-lr{transform:rotate(6deg) translateY(3%)}

  /* ===== 양치 화면 C: 클로즈업 ===== */
  .brushC{max-width:none;padding:0;justify-content:flex-start;overflow:hidden;
    background:repeating-linear-gradient(115deg,#fff0 0 140px,#ffffff59 140px 175px,#fff0 175px 380px),#d9f1ff}
  /* 카메라 층: 1em = 그림 1단위 (화면 크기에 맞춰 font-size로 조절) */
  .c-cam{position:absolute;left:0;top:0;width:1120em;height:640em;transform-origin:0 0;will-change:transform;
    transition:transform 1s cubic-bezier(.45,.05,.3,1),opacity .6s ease}
  #cScene,#cOver{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;display:block}
  #cOver{display:none}
  .inner-mode #cOver{display:block}
  #cOver .czone-ov{display:none}
  #cOver .czone-ov.row{display:inline}
  /* 앞니 안쪽: 칫솔 머리가 입 안 경계(위 190, 아래 530) 밖으로 보이지 않게. 손잡이 쪽은 열어 둠 */
  .c-bclip{position:absolute;inset:0}
  #brushC.front-u .c-bclip{clip-path:inset(150em -2000em -2000em -2000em)}
  #brushC.front-l .c-bclip{clip-path:inset(-2000em -2000em 150em -2000em)}
  .c-bpose{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform;
    transition:transform .8s cubic-bezier(.45,.05,.3,1)}
  .c-travel,.c-scrub{position:absolute;left:0;top:0;width:0;height:0}
  .c-bsvg{position:absolute;left:-95em;top:-75em;width:750em;height:105em;overflow:visible}
  .c-bsvg .b-face{display:none}
  .inner-mode .c-bsvg .b-face{display:inline}
  .inner-mode .c-bsvg .b-side{display:none}
  .c-foam{position:absolute;inset:0;pointer-events:none}
  .c-foam .fb{position:absolute;border-radius:50%;border:4.5em solid #24324a;
    background:radial-gradient(ellipse 28% 18% at 34% 30%,#fff 60%,#fff0 64%),#f2faff;
    transform:scale(0);opacity:0;transition:transform .5s cubic-bezier(.3,1.7,.5,1),opacity .4s}
  .c-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;will-change:transform;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left))}
  .c-top .icon-btn{width:44px;height:44px;display:grid;place-items:center}
  .c-top .icon-btn svg{width:18px;height:18px;fill:var(--ink)}
  .c-track{position:relative;flex:1;height:10px;border-radius:999px;background:#ffffffaa;box-shadow:inset 0 0 0 2px #fff;margin:0 28px 0 34px}
  .c-fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:var(--mint);transform:scaleX(0);transform-origin:0 50%;will-change:transform}
  .c-mark{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:3px solid #d6e6f2;display:grid;place-items:center;font-style:normal}
  .c-mark.done{background:var(--mint);border-color:#fff}
  .c-mark.done::after{content:'✓';color:#fff;font-size:12px;line-height:1}
  .c-pill{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);background:#fff;padding:5px 12px;border-radius:999px;font-size:21px;
    box-shadow:0 3px 0 #0002;white-space:nowrap;color:var(--title);z-index:1}
  .brushC.hurry .c-pill{background:var(--pink);color:#fff}
  .c-zone{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card);padding:8px 20px;
    border-radius:999px;font-size:clamp(20px,5.5vw,28px);box-shadow:0 4px 0 #0001;z-index:3;white-space:nowrap}
  .c-rider{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));
    width:min(30vw,30vh,170px);aspect-ratio:1/1;z-index:3;transition:left .8s ease;will-change:transform}
  .c-rider.right{left:calc(100% - min(30vw,30vh,170px) - 10px - env(safe-area-inset-right))}
  .c-rider .char-wrap{inset:0}
  /* 폰 깜빡임 방지: 구석 반짝이는 그림 안쪽 애니메이션을 끄고, 통째로 GPU로만 움직임 */
  .c-rider .char .body,.c-rider .char .brush,.c-rider .char .eyes,.c-rider .char .spark,.c-rider .char .hands circle,
  .c-rider .char .wing-l,.c-rider .char .wing-r,.c-rider .char .flame,.c-rider .char .spin,.c-rider .char .glow{animation:none!important}
  .c-rider .char-wrap{will-change:transform;animation:riderBob .9s ease-in-out infinite}
  @keyframes riderBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  .is-paused .c-rider .char-wrap{animation-play-state:paused}
  @media (orientation:landscape){
    .c-zone{top:auto;bottom:calc(12px + env(safe-area-inset-bottom))}
    .brushC .c-tech{top:auto;bottom:calc(64px + env(safe-area-inset-bottom))}
  }
  .c-say{position:absolute;bottom:calc(100% - 4px);left:0;background:#fff;padding:8px 14px;border-radius:16px;font-size:18px;width:max-content;max-width:min(76vw,320px);box-shadow:0 4px 0 #0001;line-height:1.3}
  .c-rider.right .c-say{left:auto;right:0}
  .c-say:empty{display:none}
  .c-say.pop{animation:pop .4s}
  :root{--bh:#ff7aa8;--bs:#3ccf9c;--bb:#3ccf9c;--bbd:#2fb487;--bk:#fff;--bks:#bfe3f7;--dd:#fff;--d-dots:0;--d-stars:0;--d-stripes:0;--d-rainbow:0}
  .c-cam .tf{fill:#f6edd0;stroke:#24324a;stroke-width:6}            /* v0.20.3 그림체 B: 진한 테두리 */
  .c-cam .oc{fill:#fbf4df;stroke:#24324a;stroke-width:3}
  .c-cam .groove{fill:none;stroke:#c9b48a;stroke-width:3;stroke-linecap:round}
  .c-cam .clean .tf{fill:#fff}
  .c-cam .clean .oc{fill:#fff}
  .c-cam .clean .groove{stroke:#dde8f0}
  .c-cam .czone.active .tf,.c-cam .czone-ov.active .tf{stroke:#ffb800;stroke-width:9}
  /* 이빨 얼굴: 더러우면 울상, 다 닦으면 웃음 */
  .c-cam .tooth.happy .tf{fill:#fff}
  .c-cam .tooth.happy .oc{fill:#fff}
  .c-cam .tooth.happy .groove{stroke:#dde8f0}
  .c-cam .fc .m-happy{display:none}
  .c-cam .tooth.happy .fc .m-happy{display:inline}
  .c-cam .tooth.happy .fc .m-sad{display:none}
  .c-cam .fc .eye{fill:#24324a}
  .c-cam .fc .lid{fill:none;stroke:#24324a;stroke-width:3.2;stroke-linecap:round}
  .c-cam .fc .mouth{fill:none;stroke:#24324a;stroke-width:3.2;stroke-linecap:round}
  .c-cam .fc .cheek{fill:#ffb3c7;opacity:.85}
  .c-cam .fc .sweat{fill:#9fdcff;stroke:#24324a;stroke-width:1.6}
  .c-cam .gloss{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.8}
  /* 칫솔 움직임: c-travel(이빨을 따라 천천히 이동) + c-scrub(방법별 동작) */
  .c-travel{animation:cTravel 2.6s ease-in-out infinite alternate}
  @keyframes cTravel{from{transform:translateX(-28em)}to{transform:translateX(28em)}}
  .c-scrub{animation:jigH .13s linear infinite alternate}                              /* 짧게 앞뒤로 */
  @keyframes jigH{from{transform:translateX(-6em)}to{transform:translateX(6em)}}
  .tech-circle .c-scrub{animation:circ .55s linear infinite}                              /* 작은 원 */
  @keyframes circ{0%{transform:translate(10em,0)}12.5%{transform:translate(7em,7em)}25%{transform:translate(0,10em)}37.5%{transform:translate(-7em,7em)}
    50%{transform:translate(-10em,0)}62.5%{transform:translate(-7em,-7em)}75%{transform:translate(0,-10em)}87.5%{transform:translate(7em,-7em)}100%{transform:translate(10em,0)}}
  .tech-roll .c-scrub{animation:roll .75s ease-in infinite}                               /* 쓸어내리기: 잇몸 → 이 끝 */
  @keyframes roll{0%{transform:translateY(-24em) rotate(-5deg)}65%{transform:translateY(22em) rotate(4deg)}100%{transform:translateY(-24em) rotate(-5deg)}}
  #brushC.surf-chew .c-scrub{animation:cScrubH .26s ease-in-out infinite alternate}      /* 씹는 면은 모두 앞뒤로 */
  #brushC.surf-chew .c-travel{animation:none}
  #brushC.surf-front .c-scrub{animation:cScrubF .3s ease-in-out infinite alternate}       /* 앞니 안쪽: 세워서 위아래로 */
  @keyframes cScrubF{from{transform:translateX(-9em)}to{transform:translateX(9em)}}
  #brushC.surf-front .c-travel{animation:none}
  @keyframes cScrubH{from{transform:translateX(-16em)}to{transform:translateX(16em)}}
  .is-paused .c-scrub,.is-paused .c-travel{animation-play-state:paused}
  .c-tech{position:absolute;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;white-space:nowrap;
    background:#fffbea;border:2px solid var(--yellow);padding:5px 14px;border-radius:999px;font-size:17px;box-shadow:0 3px 0 #0001}
  .c-tech:empty{display:none}
  .c-foam .fb.on{transform:scale(1);opacity:1}
  .c-foam.off .fb{transform:scale(1.4);opacity:0;transition:transform .9s ease,opacity .9s ease}
  .c-sparkles path{transform-box:fill-box;transform-origin:center;opacity:0}
  .c-sparkles.show path{animation:cSpark 1.1s ease-in-out infinite}
  .c-cam .plq circle{fill:#efd35a;stroke:#24324a;stroke-width:2.6}
  .c-cam .plq .eye{fill:#6b5a1f;stroke:none}
  .c-cam .crumb circle{fill:#b98352;stroke:#24324a;stroke-width:2.2}
  .c-cam .fis circle{fill:#8a5a32;stroke:#24324a;stroke-width:2.2}
  .c-cam .dw.gone{display:none}      /* 한 번에 사라짐 (그림을 여러 번 다시 그리지 않게) */
  .c-pops{position:absolute;inset:0;pointer-events:none}
  .dpop{position:absolute;width:44em;height:44em;margin:-22em 0 0 -22em;will-change:transform,opacity;animation:dPop .7s ease-out 1 forwards}
  .dpop::before{content:'';position:absolute;inset:0;background:#ffd54a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
  .dpop::after{content:'';position:absolute;inset:7em;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
  .dpop.crumb{width:30em;height:30em;margin:-15em 0 0 -15em}
  @keyframes dPop{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.15) rotate(30deg)}100%{opacity:0;transform:scale(.6) rotate(60deg)}}
  @keyframes cSpark{0%,100%{opacity:0;transform:scale(.2)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

  /* ===== 양치 전 준비: 치약 짜기 ===== */
  #prep{justify-content:safe center;gap:14px;overflow-y:auto}
  .prep-card{width:100%;background:var(--card);border-radius:28px;padding:18px 16px;box-shadow:0 6px 0 #0001;display:flex;flex-direction:column;align-items:center;gap:12px}
  .prep-step{font-size:15px;color:var(--mint)}
  .prep-title{font-size:clamp(24px,7vw,32px);text-align:center;color:var(--title);line-height:1.25}
  .prep-scene{width:100%;max-width:420px}
  .prep-scene svg{width:100%;display:block;overflow:hidden}
  .paste{transform-box:fill-box;transform-origin:85% 50%;transform:scale(0);animation:pasteOut 1.6s .4s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes pasteOut{to{transform:scale(1)}}
  .tube{animation:tubeSq 1.6s .3s ease-in-out forwards;transform-box:fill-box;transform-origin:100% 50%}
  @keyframes tubeSq{0%{transform:translateX(0) scaleY(1)}40%{transform:translateX(-6px) scaleY(.82)}100%{transform:translateX(0) scaleY(.9)}}
  .prep-compare{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;background:#fffbea;border:2px solid var(--yellow);border-radius:999px;padding:8px 18px}
  .prep-compare svg{width:34px;height:34px;flex-shrink:0}
  .prep-note{font-size:14px;opacity:.7;text-align:center;line-height:1.45}
  .prep-tips{display:flex;gap:8px;width:100%;justify-content:center}
  .prep-tip{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#f3f9fe;border-radius:16px;padding:8px 4px;font-size:14px;text-align:center;line-height:1.2}
  .prep-tip svg{width:44px;height:44px}
  .prep-tip.on{background:#fffbea;box-shadow:0 0 0 3px var(--yellow)}
  .listen-btn{font-size:17px;padding:8px 16px;border-radius:999px;background:#eef6fc}
  .rec-list{display:flex;flex-direction:column;gap:8px}
  .rec-row{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed #dbe8f2}
  .rec-row .rt{flex:1;min-width:0;font-size:15px;line-height:1.3}
  .rec-row .rt small{display:block;font-size:12px;opacity:.55}
  .rec-row .rt.mine small{color:var(--mint);opacity:1}
  .rec-row button{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#eef6fc;font-size:16px}
  .rec-row button.rec{background:#ffe3ec;color:#e0245e}
  .rec-row button.rec.on{background:#e0245e;color:#fff;animation:breathe .8s infinite}
  .rec-row button:disabled{opacity:.3}
  /* 소리 설정 창 */
  .audio-pop{position:fixed;inset:0;background:#24324a66;display:none;align-items:flex-start;justify-content:center;z-index:25;
    padding:calc(68px + env(safe-area-inset-top)) 16px 16px}
  .audio-pop.show{display:flex}
  .ap-box{background:#fff;border-radius:24px;padding:16px 18px;width:min(100%,340px);display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px #0002;animation:pop .25s}
  .ap-title{font-size:20px;color:var(--title);text-align:center}
  .ap-box .set-row select{max-width:62%}
  .ap-close{align-self:center;font-size:17px;opacity:.65;padding:6px 14px}
  .file-name{font-size:14px;opacity:.7;word-break:break-all}
  .spit-pill{display:flex;align-items:center;gap:6px;background:#fff;padding:6px 14px;border-radius:999px;font-size:17px;box-shadow:0 3px 0 #0001}
  .spit-pill svg{width:30px;height:30px}

  /* ===== 보너스: 혀 닦기 ===== */
  #tongue{justify-content:safe center;gap:14px;overflow-y:auto}
  .tg-title{font-size:clamp(22px,7vw,34px);color:var(--title);text-align:center;max-width:100%;overflow-wrap:anywhere;line-height:1.2}   /* v0.25: 일본어 제목이 오른쪽으로 잘리던 것 */
  .tg-stage{position:relative;width:min(80vw,44vh,340px);aspect-ratio:1/1;overflow:hidden;border-radius:32px;background:#ffe9ef;box-shadow:0 6px 0 #0001}
  .tg-stage > svg{position:absolute;inset:0;width:100%;height:100%}
  .tg-brush{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity;transform:translate(150em,128em);transition:opacity .5s}
  .tg-stage.end .tg-brush{opacity:0}
  .tg-brush svg{position:absolute;left:-26em;top:-40em;width:52em;height:330em;overflow:visible}
  .tg-stage.go .tg-brush{animation:tgSweep 1.6s cubic-bezier(.4,0,.3,1) 3}
  @keyframes tgSweep{0%{transform:translate(150em,128em)}70%{transform:translate(150em,236em)}100%{transform:translate(150em,128em)}}
  .tg-stage .coat{transition:opacity .4s}
  .tg-stage .coat.gone{opacity:0}
  .tg-count{display:flex;gap:10px}
  .tg-count i{width:16px;height:16px;border-radius:50%;background:#e3eef7}
  .tg-count i.on{background:var(--mint)}
  .tg-say{background:var(--card);padding:8px 16px;border-radius:16px;font-size:19px;text-align:center;box-shadow:0 3px 0 #0001}
  .tg-tip{font-size:14px;opacity:.7;text-align:center}

  /* 꾸미기 화면 */
  #closet{justify-content:flex-start}
  .closet-panel{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:24px;padding:12px;box-shadow:0 6px 0 #0001}
  .tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:8px 16px;border-radius:999px;background:#eef6fc;font-size:18px;white-space:nowrap}
  .tab.active{background:var(--pink);color:#fff}
  .grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;padding:2px}
  .item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:18px;background:#fff;border:3px solid #e3f1fb}
  .item .thumb{width:100%;aspect-ratio:1/1;display:grid;place-items:center}
  .item .thumb svg{width:84%;height:84%;overflow:visible}
  .item .thumb svg.bthumb{width:112%;height:auto;transform:rotate(-28deg)}
  .item.locked .thumb:has(.bthumb){opacity:.8;filter:grayscale(.25)}
  .item .name{font-size:14px;line-height:1.2;text-align:center}
  .item .tag{font-size:13px;color:#7a8aa3}
  .item.equipped{border-color:var(--yellow);background:#fffbea}
  .item.equipped .tag{color:#d99a00}
  .item.locked .thumb{opacity:.45;filter:grayscale(.6)}
  .item.locked .tag{color:var(--pink-d)}
  .item.event{border-color:#ffc9dc}

  /* 색종이 */

  .cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}

  @media (max-height:700px){

  }

  }

<script>

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

     0. 설정값 · 외부 리소스
        RES = window.BJ_RESOURCES (resources.js에서 넣음, 없으면 빈 값)

        의도: 숫자 조절(보상 · 확률 · 속도)은 코드 대신 여기서만. 출시 땐 resources.js 의 config 로 덮어씀

  // 받은 언어팩보다 새 버전이 있으면 갱신 (샘플은 바로 교체, 서버 팩은 나중에 다시 내려받기)
  PACK_CATALOG.forEach(e => {
    const p = packs[e.code];
    if (p && e.sample && !e.url && (p.meta.version || 1) < (e.sample.meta.version || 1)){
      packs[e.code] = JSON.parse(JSON.stringify(e.sample));
      store.set('pack_' + e.code, packs[e.code]);
    }

  const detectLang = () => {
    const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return packs[nav] ? nav : 'en';
  };
  let lang = store.get('lang', null);
  if (!packs[lang]) lang = detectLang();

  function lookup(key){
    for (const code of [lang, 'en', 'ko']){
      const p = packs[code];
      if (p && p.strings[key] !== undefined) return p.strings[key];
    }
    return null;
  }
  function hasBatchim(word){
    const s = String(word || ''), c = s.charCodeAt(s.length - 1) - 0xAC00;
    return c >= 0 && c <= 11171 && c % 28 !== 0;
  }
  function format(str, params){
    return String(str).replace(/\{(\w+)(?:\|([^}]*))?\}/g, (m, k, opt) => {
      if (opt){ const [a, b] = opt.split('/'); return hasBatchim(params[k]) ? a : b; }
      return params[k] !== undefined ? params[k] : m;
    });
  }
  // t('키', {n:3, item:'왕관'})
  function t(key, params = {}){
    let v = null;
    if (typeof params.n === 'number'){
      try{ v = lookup(key + '_' + new Intl.PluralRules(lang).select(params.n)); }catch(e){}
      if (v === null) v = lookup(key + '_other');
    }
    if (v === null) v = lookup(key);
    if (v === null) return key;
    if (Array.isArray(v)) v = pick(v);
    return format(v, params);
  }
  const tList = (key) => { const v = lookup(key); return Array.isArray(v) ? v : (v ? [v] : []); };

  async function installPack(entry){
    let pack;
    if (entry.url){
      const res = await fetch(entry.url);
      if (!res.ok) throw new Error('download failed');
      pack = await res.json();
    } else {
      await new Promise(r => setTimeout(r, 700));   // 샘플: 받는 흉내
      pack = JSON.parse(JSON.stringify(entry.sample));
    }
    if (!pack.meta || !pack.strings) throw new Error('bad pack');
    packs[pack.meta.code] = pack;
    store.set('pack_' + pack.meta.code, pack);
    const list = store.get('packs', []);
    if (!list.includes(pack.meta.code)) store.set('packs', list.concat(pack.meta.code));
    return pack;
  }

  const loadedFonts = new Set();

    const f = packs[lang].meta.font;
    if (f && f.url && !loadedFonts.has(f.url)){
      const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f.url;
      document.head.appendChild(l); loadedFonts.add(f.url);
    }
    document.documentElement.style.setProperty('--font', f ? f.family : "'Jua'");
  }

  const COUNTRIES = ['KR','US','JP','GB','CA','AU','NZ','IE','DE','FR','ES','IT','MX','BR','CN','TW','VN','TH','ID','IN','SG','PH'];
  const HALLOWEEN_COUNTRIES = ['US','CA','GB','IE','AU','NZ','KR','JP','DE','FR','MX'];

  const EVENTS = [
    { id:'birthday',     icon:'🎂', countries:'*', when:{ type:'birthday' }, look:{ head:'head_party', hand:'hand_cake' }, effect:'balloon', bonus:5 },
    { id:'seollal',      icon:'🪁', countries:['KR'], when:{ type:'lunar', month:1, day:1, before:2, after:2 }, look:{ hand:'hand_bok' }, effect:'star' },
    { id:'chuseok',      icon:'🌕', countries:['KR'], when:{ type:'lunar', month:8, day:15, before:2, after:2 }, look:{ head:'head_bunny' }, effect:'star' },
    { id:'childrensday', icon:'🎈', countries:['KR','JP'], when:{ type:'fixed', from:'05-05', to:'05-05' }, look:{ head:'head_party', hand:'hand_pinwheel' }, effect:'petal' },
    { id:'halloween',    icon:'🎃', countries:HALLOWEEN_COUNTRIES, when:{ type:'fixed', from:'10-24', to:'10-31' }, look:{ head:'head_witch', hand:'hand_pumpkin' }, effect:'bat' },
    { id:'xmas',         icon:'🎄', countries:'*', when:{ type:'fixed', from:'12-18', to:'12-26' }, look:{ head:'head_santa', hand:'hand_present' }, effect:'snow' },

  // 외부 리소스: 이벤트 추가·교체 (같은 id면 바꿈). texts:{ ko:{ name, greet, cheer } }
  (RES.events || []).forEach(e => {
    if (!e || !e.id || !e.when) return;
    const i = EVENTS.findIndex(x => x.id === e.id);
    const ev = Object.assign({ icon:'⭐', countries:'*', look:{}, effect:'star' }, e);
    if (i >= 0) EVENTS[i] = ev; else EVENTS.push(ev);
    Object.entries(e.texts || {}).forEach(([code, tx]) => {

  const detectCountry = () => {
    const m = (navigator.language || '').match(/-([A-Z]{2})/i);
    const c = m ? m[1].toUpperCase() : (lang === 'ko' ? 'KR' : 'US');
    return COUNTRIES.includes(c) ? c : (lang === 'ko' ? 'KR' : 'US');

  let lunarFmt = null;
  try{ lunarFmt = new Intl.DateTimeFormat('en-u-ca-chinese', { month:'numeric', day:'numeric' }); }catch(e){}
  // v0.28.4 음력 달력을 모르는 브라우저는 말없이 양력으로 계산함 → 1월 1일을 설날로 착각하지 않게 그땐 음력 행사를 끔
  try{ if (lunarFmt && lunarFmt.resolvedOptions().calendar !== 'chinese') lunarFmt = null; }catch(e){ lunarFmt = null; }
  function lunarMD(d){
    if (!lunarFmt) return null;
    const parts = lunarFmt.formatToParts(d);
    const m = (parts.find(p => p.type === 'month') || {}).value, dd = (parts.find(p => p.type === 'day') || {}).value;
    if (!/^\d+$/.test(m || '') || !/^\d+$/.test(dd || '')) return null;   // 윤달 제외
    return [+m, +dd];
  }
  const mmdd = (d) => (d.getMonth() + 1) * 100 + d.getDate();
  function inFixed(d, from, to){
    const a = +from.replace('-', ''), b = +to.replace('-', ''), x = mmdd(d);
    return a <= b ? (x >= a && x <= b) : (x >= a || x <= b);
  }
  function inLunar(d, w){
    for (let j = -(w.after || 0); j <= (w.before || 0); j++){
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + j, 12);

  };
  Object.entries(WK_SHAPES).forEach(([sh, S]) => Object.entries(WK_COLORS).forEach(([cn, [c, d]]) => {

  }));
  // 날짜로 정해지는 섞기 (같은 주에는 누구나 같은 물건)
  const mix = (x) => { x = Math.imul(x ^ (x >>> 16), 0x45d9f3b); x = Math.imul(x ^ (x >>> 16), 0x45d9f3b); return (x ^ (x >>> 16)) >>> 0; };
  const hashStr = (s) => { let h = 7; for (let i = 0; i < s.length; i++) h = Math.imul(h, 31) + s.charCodeAt(i) | 0; return mix(h); };
  const weekNo = (d = new Date()) => Math.floor((dayNum(d) - 4) / 7);                 // 월요일에 바뀜
  const weekDaysLeft = (d = new Date()) => 7 - (((dayNum(d) - 4) % 7) + 7) % 7;
  function weeklyIds(w = weekNo()){
    const shapes = Object.keys(WK_SHAPES), cols = Object.keys(WK_COLORS), out = [];
    for (let k = 0; k < 4; k++){                                                        // 주마다 다른 부위 4곳
      const sl = SLOT_IDS[(w + k) % SLOT_IDS.length], list = shapes.filter(s => WK_SHAPES[s].slot === sl);
      out.push('wk_' + list[mix(w * 31 + k * 7 + 3) % list.length] + '_' + cols[mix(w * 17 + k * 11 + 5) % cols.length]);
    }
    return out;
  }
  /* ---------- 세균 그림 (양치 화면 공용) ---------- */
  const GERM_COL = [['#8ee06a', '#4fa83a'], ['#c79bff', '#8f5fd8'], ['#ffb86b', '#e0852e'], ['#6fd3e6', '#2f9fb8']];
  const CROWN = '<path d="M-14 -21 L-15 -35 L-7 -27 L0 -38 L7 -27 L15 -35 L14 -21Z" fill="#ffd54a" stroke="#e0a100" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-38" r="2.6" fill="#ff7aa8"/>';
  const GOLD_FX = '<g fill="#fff"><path d="M25 -27 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path d="M-28 16 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/></g>';
  // k: 색 번호 | 'gold' | [몸색, 테두리색] / boss: true(왕관만) 또는 대장 정의 { behind, below, above }
  function germInner(k, boss){
    return stickered(germBody(k, boss), 5);
  }

      '<circle cx="-7" cy="-1" r="5.4" fill="#fff"/><circle cx="7" cy="-1" r="5.4" fill="#fff"/><circle cx="-6" cy="0" r="2.8" fill="#24324a"/><circle cx="8" cy="0" r="2.8" fill="#24324a"/>' +

  /* 오늘의 대장 세균: 날짜 + 아침/저녁마다 차례로 바뀜 (resources.js 의 bosses 로 추가·교체 가능) */

  /* =========================================================
     6. 캐릭터 담당 코드 (Character 모듈)

     ========================================================= */
  const Character = (() => {
    /* 그림체 B "말랑 스티커" (v0.20): 진한 테두리(#24324a) + 바깥 흰 테두리 + 연한 그림자 한 줄

    const itemSvg = (id) => stickered(ITEMS[id].svg, 7, ITEMS[id].outline !== false);
    const itemMarkup = (id) => (id && ITEMS[id]) ? `<g data-item="${id}">${itemSvg(id)}</g>` : '';

      container.innerHTML = markup(l);
      const svg = container.querySelector('svg');
      let cheerT = 0;
      return {
        el: svg,
        setLook(nl){ SLOT_IDS.forEach(s => { svg.querySelector(`[data-slot="${s}"]`).innerHTML = itemMarkup(nl[s]); }); svg.querySelector('.aura').innerHTML = auraOf(nl); },
        setState(st){ svg.classList.remove('brushing', 'happy'); if (st === 'brushing' || st === 'happy') svg.classList.add(st); },

          clearTimeout(cheerT); cheerT = setTimeout(() => svg.classList.remove('cheer'), 650);

    return { mount, thumb, art:markup };

  /* 지금 실제로 보여줄 모습 = 아이가 고른 옷 + 이벤트 옷 + 이벤트 중 아이가 바꾼 것 */
  function effectiveLook(){
    const ev = activeEvent();
    const l = {};
    SLOT_IDS.forEach(s => {
      let id = look[s];

  /* =========================================================

     ========================================================= */
  let current = 'home';
  function show(id){
    const prev = current;
    current = id; $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    if (prev === 'done' && id !== 'done' && typeof clearGift === 'function') clearGift();   // 선물 연출 정리
    if (id === 'home' && petPend && petPend.length) setTimeout(petPendingShow, 400);                          // 못 본 부화·성장 축하

    if (id !== 'home' && !(history.state && history.state.bj)){ try{ history.pushState({ bj:1 }, ''); }catch(e){} }
  }

  let dlgOk = null, dlgCancel = null;
  function dialog({ text, ok, cancel, onOk, onCancel, icon = '' }){

    $('#dlgText').textContent = text;
    $('#dlgOk').textContent = ok;
    $('#dlgCancel').textContent = cancel;
    dlgOk = onOk || null; dlgCancel = onCancel || null;
    $('#modal').classList.add('show');
  }
  const closeDialog = () => $('#modal').classList.remove('show');
  // 뒤로 가기: 창이 열려 있으면 닫기 → 양치 중이면 그만할지 묻기 → 그 밖엔 첫 화면으로
  window.addEventListener('popstate', () => {
    const keep = () => { try{ history.pushState({ bj:1 }, ''); }catch(e){} };

    if ($('#gate').classList.contains('show')){ gateClose(); if (current !== 'home') keep(); return; }

    if ($('#petShow').classList.contains('show')){ if (!$('#psOk').hidden) $('#psOk').click(); keep(); return; }

  /* =========================================================
     9. 소리 & 목소리
        의도: 글을 못 읽는 아이를 위해 중요한 말은 모두 목소리로 (Voice.play(키, 글)). 언어팩에 녹음 파일이 있으면 그걸 먼저
              효과음은 파일 없이 tone()으로 만들어 가볍게. 배경음악은 코드 곡 + 부모가 넣은 파일
     ========================================================= */
  let actx = null;
  function ac(){
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur = .2, type = 'sine', vol = .15, delay = 0, ch = 'sfx'){
    if (ch === 'music' ? !musicOn : !soundOn) return;
    const a = ac(); if (!a) return;
    const tt = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, tt);
    g.gain.setValueAtTime(.0001, tt);
    g.gain.exponentialRampToValueAtTime(vol, tt + .02);
    g.gain.exponentialRampToValueAtTime(.0001, tt + dur);
    o.connect(g); g.connect(a.destination);
    o.start(tt); o.stop(tt + dur + .05);
  }
  const sfx = {
    start(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .18, i * .1)); },
    zone(){ tone(880, .18, 'sine', .2); tone(660, .3, 'sine', .2, .18); },
    done(){ [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? .6 : .16, 'triangle', .2, i * .13)); },
    tap(){ tone(620, .06, 'sine', .12); },
    equip(){ tone(700, .08, 'sine', .15); tone(1050, .12, 'sine', .15, .07); },
    buy(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'triangle', .18, i * .08)); },
    nope(){ tone(300, .12, 'square', .06); tone(240, .16, 'square', .06, .12); }
  };
  // 외부 리소스: 효과음을 파일로 바꾸기 (sfx:{ start:'start.mp3', done:'done.mp3', … })
  Object.entries(RES.sfx || {}).forEach(([k, url]) => {
    sfx[k] = () => { if (!soundOn) return; try{ const a = new Audio(url); a.volume = .8; a.play().catch(() => {}); }catch(e){} };
  });

  /* ---------- 배경음악 ----------
     코드로 만든 곡 5개 (step: 한 박 길이 ms, mel: 0은 쉼표, bass: 4박마다) + 내 음악 파일 */
  const TRACKS = {
    sunny:  { step:300, wave:'triangle', vol:.04,  bass:[131, 175, 196, 131],
              mel:[523,0,659,784, 659,0,523,587, 659,784,880,784, 659,587,523,0, 587,0,698,880, 784,698,659,587, 523,659,784,1047, 784,0,0,0] },
    march:  { step:230, wave:'square',   vol:.018, bass:[131, 196, 147, 196],
              mel:[523,523,659,784, 784,0,659,0, 698,698,587,698, 659,0,523,0, 523,523,659,784, 1047,0,880,0, 784,698,659,587, 523,0,0,0] },
    calm:   { step:420, wave:'sine',     vol:.05,  bass:[131, 110, 87, 98],
              mel:[392,0,523,0, 494,0,440,0, 392,0,330,0, 349,0,392,0, 440,0,523,0, 494,0,440,0, 392,0,0,0, 0,0,0,0] },
    bubbly: { step:190, wave:'triangle', vol:.035, bass:[131, 165, 196, 165],
              mel:[659,784,880,784, 659,0,587,0, 523,587,659,0, 784,0,0,0, 880,784,659,784, 880,0,1047,0, 880,784,659,587, 523,0,0,0] },
    birthday:{ step:270, wave:'triangle', vol:.045, hidden:true, bass:[131, 196, 196, 131, 131, 175, 196, 131, 175, 131, 98, 131],   // 생일 축하 노래 (퍼블릭 도메인 멜로디)
              mel:[392,392,440,0, 392,0,523,0, 494,0,0,0, 392,392,440,0, 392,0,587,0, 523,0,0,0, 392,392,784,0, 659,0,523,0, 494,0,440,0, 698,698,659,0, 523,0,587,0, 523,0,0,0] },
    space:  { step:260, wave:'sine',     vol:.045, bass:[110, 87, 131, 98],
              mel:[440,523,659,523, 440,523,659,880, 349,440,523,440, 349,440,523,698, 523,659,784,659, 523,659,784,1047, 392,494,587,494, 392,494,587,784] }
  };
  // 외부 리소스: 배경음악 추가 (코드 곡 { step, wave, vol, mel, bass } 또는 파일 { file:'music.mp3' }), 이름은 names
  Object.entries(RES.tracks || {}).forEach(([k, v]) => {
    TRACKS[k] = v;
    Object.entries(v.names || {}).forEach(([code, txt]) => { if (packs[code]) packs[code].strings['bgm.' + k] = txt; });
  });
  const audioEl = new Audio(); audioEl.loop = true; audioEl.preload = 'auto';
  let customUrl = null, customName = store.get('bgmName', '');
  let musicTimer = null, duckTimer = null, beat = 0, previewT = 0;
  const speaking = () => { try{ return (typeof recPlaying === 'function' && recPlaying()) || ('speechSynthesis' in window && speechSynthesis.speaking); }catch(e){ return false; } };
  function musicStart(){
    musicStop();
    if (!musicOn) return;
    if (bgm === 'custom'){
      if (!customUrl) return;
      if (audioEl.src !== customUrl) audioEl.src = customUrl;
      try{ audioEl.currentTime = 0; }catch(e){}
      audioEl.volume = .6; audioEl.play().catch(() => {});
      duckTimer = setInterval(() => { audioEl.volume = speaking() ? .2 : .6; }, 200);   // 목소리 나올 땐 작게
      return;
    }
    const evn = activeEvent();
    const tr = (evn && evn.id === 'birthday') ? TRACKS.birthday : (TRACKS[bgm] || TRACKS.sunny); beat = 0;   // 생일엔 생일 축하 노래
    if (tr.file){                                    // 외부 리소스의 음악 파일 곡
      if (audioEl.src !== new URL(tr.file, location.href).href) audioEl.src = tr.file;
      try{ audioEl.currentTime = 0; }catch(e){}
      audioEl.volume = .6; audioEl.play().catch(() => {});
      duckTimer = setInterval(() => { audioEl.volume = speaking() ? .2 : .6; }, 200);
      return;
    }
    musicTimer = setInterval(() => {
      if (paused) return;
      const duck = speaking() ? .3 : 1, f = tr.mel[beat % tr.mel.length];
      if (f) tone(f, Math.min(.3, tr.step / 1000 * .85), tr.wave, tr.vol * duck, 0, 'music');
      if (beat % 4 === 0) tone(tr.bass[Math.floor(beat / 4) % tr.bass.length], tr.step * 1.3 / 1000, 'sine', .06 * duck, 0, 'music');
      beat++;
    }, tr.step);
  }
  function musicStop(){
    clearInterval(musicTimer); musicTimer = null; clearInterval(duckTimer); duckTimer = null;
    clearTimeout(previewT);
    try{ audioEl.pause(); }catch(e){}
  }
  function musicPause(p){
    if (!musicOn || !(bgm === 'custom' ? customUrl : (TRACKS[bgm] || {}).file)) return;
    try{ if (p) audioEl.pause(); else audioEl.play().catch(() => {}); }catch(e){}
  }
  function musicPreview(){
    ac();
    if (bgm === 'custom' && !customUrl){ toast(t('audio.noCustom')); return; }
    if (running) { musicStart(); return; }
    musicStart(); clearTimeout(previewT);
    previewT = setTimeout(() => { if (!running) musicStop(); }, 8000);
  }

  /* 내 음악 파일: IndexedDB에 저장 (안 되면 이번 실행에서만) */
  const BgmStore = {
    open(){ return new Promise((res, rej) => { try{ const r = indexedDB.open('bj_db', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); },
    async put(blob){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, 'bgm'); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
    async get(){ const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('files').objectStore('files').get('bgm'); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
  };
  (async () => { try{ const b = await BgmStore.get(); if (b){ customUrl = URL.createObjectURL(b); syncAudioUI(); } }catch(e){} })();

  /* ---------- 내 목소리 녹음 ----------
     문장마다 가장 최근 녹음 하나만 (키: rec:언어:문장키, 다시 녹음하면 덮어씀) */
  const REC_KEYS = ['prep', 'say.ul', 'say.ur', 'say.lr', 'say.ll', 'say.chew', 'say.inner', 'say.front', 'say.cheers', 'say.bossTease', 'say.raid', 'say.boss', 'say.bossDown', 'say.sparkle', 'tongue.say', 'done'];
  const recKeyOf = (k) => /^prep\./.test(k) ? 'prep' : (/^event\..*\.cheer$/.test(k) ? 'say.cheers' : k);
  const RecStore = {
    async put(key, blob){ const db = await BgmStore.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
    async get(key){ const db = await BgmStore.open(); return new Promise((res, rej) => { const q = db.transaction('files').objectStore('files').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); },
    async del(key){ const db = await BgmStore.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  };
  const recs = {};           // 문장키 → 재생 주소 (지금 언어)
  async function loadRecs(){
    Object.keys(recs).forEach(k => { URL.revokeObjectURL(recs[k]); delete recs[k]; });
    for (const k of REC_KEYS){ try{ const b = await RecStore.get(`rec:${lang}:${k}`); if (b) recs[k] = URL.createObjectURL(b); }catch(e){} }
    if (current === 'settings') renderRecs();
  }
  loadRecs();
  const recAudio = new Audio();
  const recPlaying = () => !recAudio.paused && !recAudio.ended;
  async function loadBgmFile(file){
    if (!file) return;
    if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|aac|wav|ogg)$/i.test(file.name)){ toast(t('audio.notAudio')); return; }
    if (file.size > CONFIG.musicMaxMB * 1024 * 1024){ toast(t('audio.tooBig')); return; }
    if (customUrl) URL.revokeObjectURL(customUrl);
    customUrl = URL.createObjectURL(file);
    customName = file.name; store.set('bgmName', customName);
    bgm = 'custom'; store.set('bgm', bgm); musicOn = true; store.set('music', true);
    syncAudioUI();
    try{ await BgmStore.put(file); toast(t('audio.loadOk')); }catch(e){ toast(t('audio.loadTemp')); }
    musicPreview();
  }

  /* 목소리 응원: 언어팩에 녹음 파일이 있으면 재생, 없으면 기기 음성 합성 */
  const Voice = (() => {
    const can = 'speechSynthesis' in window;
    let voices = [];
    const load = () => { try{ voices = speechSynthesis.getVoices() || []; }catch(e){} };
    if (can){ load(); try{ speechSynthesis.addEventListener('voiceschanged', load); }catch(e){} }
    const clean = (s) => String(s).replace(/\p{Extended_Pictographic}|️|…/gu, '').replace(/\s+/g, ' ').trim();
    function audioUrl(key){
      const a = packs[lang].audio;
      return (a && a.files && a.files[key]) ? (a.base || '') + a.files[key] : null;
    }
    // 덜 중요한 말: 다른 말을 하는 중이면 끊지 않고 건너뜀
    const LOW = (k) => k === 'say.cheers' || k === 'say.resume' || /^event\./.test(k);
    // 같은 언어 목소리 중 자연스러운 것 우선
    const QUALITY = /natural|neural|enhanced|premium|google|siri|samantha|yuna|kyoko/i;
    function play(key, text){
      if (!voiceOn) return;
      const mine = recs[recKeyOf(key)];
      if (mine){                                          // 내가 녹음한 목소리가 있으면 그걸로
        if (recPlaying() && LOW(key)) return;
        try{ if (can) speechSynthesis.cancel(); }catch(e){}
        try{ recAudio.pause(); recAudio.src = mine; recAudio.currentTime = 0; recAudio.play().catch(() => {}); }catch(e){}
        return;
      }
      const url = audioUrl(key);
      if (url){ try{ new Audio(url).play().catch(() => {}); }catch(e){} return; }
      if (!can) return;
      const code = packs[lang].meta.tts || lang;
      const norm = (v) => (v.lang || '').toLowerCase().replace('_', '-');
      const same = voices.filter(x => norm(x) === code.toLowerCase());
      const cands = same.length ? same : list();
      const picked = voiceName && list().find(x => (x.voiceURI || x.name) === voiceName);   // 지금 언어 목소리 중에서만
      const v = picked || cands.find(x => QUALITY.test(x.name)) || cands.find(x => x.localService) || cands[0];
      if (voices.length && !v) return;     // 이 언어 목소리가 기기에 없음
      try{
        if (speechSynthesis.speaking){
          if (LOW(key)) return;
          speechSynthesis.cancel();
        }
        const u = new SpeechSynthesisUtterance(clean(text));
        const tn = TONES[voiceTone] || TONES.kind;
        u.lang = code; if (v) u.voice = v; u.rate = tn.rate; u.pitch = tn.pitch;
        speechSynthesis.speak(u);
      }catch(e){}
    }
    const stop = () => { try{ if (can) speechSynthesis.cancel(); }catch(e){} try{ recAudio.pause(); }catch(e){} };
    // 지금 언어로 말할 수 있는 목소리 목록 (설정 화면용)
    // 언어 코드 앞부분이 정확히 같은 것만 (ko ≠ kok 코카니어)
    const primary = (l) => String(l || '').toLowerCase().split(/[-_]/)[0];
    const list = () => { const code = primary(packs[lang].meta.tts || lang); return voices.filter(x => primary(x.lang) === code); };
    return { play, stop, list };
  })();

  function refreshSoundIcons(){

  function toggleSound(){ ac(); syncAudioUI(); $('#audioPop').classList.add('show'); }   // 🔊 → 소리 설정 창
  $('#apClose').addEventListener('click', () => $('#audioPop').classList.remove('show'));
  $('#audioPop').addEventListener('click', (e) => { if (e.target.id === 'audioPop') $('#audioPop').classList.remove('show'); });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.classList.contains('ap-voice')){ voiceOn = el.checked; store.set('voice', voiceOn); if (!voiceOn) Voice.stop(); else Voice.play('say.sample', t('say.ul')); }
    else if (el.classList.contains('ap-music')){ musicOn = el.checked; store.set('music', musicOn); if (!musicOn) musicStop(); else if (running) musicStart(); }
    else if (el.classList.contains('ap-sfx')){ soundOn = el.checked; store.set('sound', soundOn); if (soundOn) sfx.tap(); }
    else if (el.classList.contains('ap-bgm')){

  $('#bgmTry').addEventListener('click', () => musicPreview());
  $('#bgmLoad').addEventListener('click', () => $('#bgmFile').click());
  $('#bgmFile').addEventListener('change', (e) => { loadBgmFile(e.target.files && e.target.files[0]); e.target.value = ''; });
  function buzz(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  let wakeLock = null;
  async function keepAwake(){ try{ if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
  function releaseAwake(){ try{ if (wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ if (running && !paused) keepAwake(); return; }
    // 다른 앱으로 가거나 화면이 꺼지면: 양치 중이면 자동 일시정지 (돌아와서 ▶ 누르면 이어서)
    if (CONFIG.pauseWhenHidden && running && !paused) togglePause(true);
    Voice.stop();
  });

  /* =========================================================
     10. 이벤트 화면 효과
        의도: 눈 · 박쥐 · 꽃잎 같은 배경 효과 (양치 중엔 멈춰서 집중 방해 안 함)
     ========================================================= */
  let fxTimer = null, fxType = null;
  function setEffect(type){
    if (type === fxType) return;
    fxType = type; clearInterval(fxTimer); fxTimer = null; $('#fx').innerHTML = '';
    if (!type) return;
    const every = type === 'snow' ? 220 : type === 'balloon' ? 900 : 520;
    fxTimer = setInterval(() => spawnFx(type), every);
    for (let i = 0; i < 6; i++) spawnFx(type, true);
  }
  function spawnFx(type, early){
    const fx = $('#fx'); if (fx.childElementCount > 60 || document.hidden || document.body.classList.contains('brushing')) return;

  //   문제: (3~9) × (6~9), 답 18~81. 틀리면 새 문제. CONFIG.parentGate:false 면 안 물음
  let gateAnswer = 0, gateInput = '', gateNext = null;
  function gateNew(){

    gateNew(); $('#gate').classList.add('show');
    if (!(history.state && history.state.bj)){ try{ history.pushState({ bj:1 }, ''); }catch(e){} }   // 뒤로 가기로 닫히게 (첫 화면에서 앱이 꺼지지 않게)

    if (gateInput && +gateInput === gateAnswer){ const f = gateNext; gateClose(); if (f) f(); return; }

  function recLabel(k){

  function stopRecording(){
    clearTimeout(recStopT);
    try{ if (recorder && recorder.state !== 'inactive') recorder.stop(); }catch(e){}
  }
  async function startRecording(k){
    if (recorder && recorder.state === 'recording'){ stopRecording(); return; }
    try{
      recStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }catch(e){ toast(t('rec.noMic')); return; }
    musicStop(); Voice.stop();
    recChunks = []; recFor = k;
    try{ recorder = new MediaRecorder(recStream); }catch(e){ toast(t('rec.noMic')); recStream.getTracks().forEach(x => x.stop()); recFor = null; return; }
    recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
    recorder.onstop = async () => {
      recStream.getTracks().forEach(x => x.stop());

  const CScene = (() => {

    const half = (x) => {
      const dx = Math.abs(x - CX) - (IRX - RCX);
      if (dx <= 0) return IRY;
      return (IRY - RCY) + RCY * Math.sqrt(Math.max(0, 1 - (dx / RCX) ** 2));

    /* 유치 기준 (위아래 각 10개). 한쪽: 가운데 앞니 → 옆 앞니 → 송곳니 → 첫째 어금니 → 둘째 어금니

    const SPEC = [

  const PET_CFG = Object.assign({ hatch:4, grow:[5, 7], perDay:2, specialEggChance:.15 }, (RES.config || {}).pet || {});
  /* =========================================================

       → 새 동물은 아래 SPECIES 목록에 한 줄 추가하면 됨
       좌표: 가운데 (0,0), 바닥 y≈44, 크기 100×100
       의도: 252종 + 전설 11종을 한 사람이 다 그릴 수 없어서 부품 조립식. 나중에 진짜 그림이 생기면 resources.js pets 로 교체

       아래 SPECIES 한 줄 = [id, 한국어, 영어, 일본어, 몸 틀(q 네발 · b 새 · p 펭귄 · f 물고기 · r 파충류 · x 곤충/특수), 부품]
     ========================================================= */
  const PetGen = (() => {
    const f1 = (n) => String(Math.round(n * 10) / 10);
    const shade = (hex, a) => {
      let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const n = parseInt(c, 16), ch = [n >> 16, (n >> 8) & 255, n & 255];
      return '#' + ch.map(v => Math.max(0, Math.min(255, Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a))).toString(16).padStart(2, '0')).join('');
    };
    const E = (x, y, rx, ry, fill, ex = '') => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${fill}"${ex ? ' ' + ex : ''}/>`;
    const C = (x, y, r, fill, ex = '') => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${fill}"${ex ? ' ' + ex : ''}/>`;
    const P = (d, fill, ex = '') => `<path d="${d}" fill="${fill}"${ex ? ' ' + ex : ''}/>`;
    const S = (d, c, w, ex = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${ex ? ' ' + ex : ''}/>`;
    const M = (svg) => svg + `<g transform="scale(-1 1)">${svg}</g>`;          // 왼쪽만 그리고 좌우 대칭
    const R = (a, x, y) => `transform="rotate(${a} ${f1(x)} ${f1(y)})"`;
    const INK = '#24324a';
    const lum = (hex) => { if (!/^#/.test(hex)) return 0; let c = hex.slice(1); if (c.length === 3) c = c.split('').map(x => x + x).join(''); const n = parseInt(c, 16); return ((n >> 16) * .299 + ((n >> 8) & 255) * .587 + (n & 255) * .114) / 255; };
    const ol = (c) => lum(c) > .84 ? `stroke="${shade(c, -.17)}" stroke-width="2"` : '';     // 하얀 동물은 테두리
    const eyes = (y, x = 10, r = 4.4, cx = 0) => `<g transform="translate(${cx} 0)">` + M(C(-x, y, r, INK) + C(-x + r * .32, y - r * .36, r * .34, '#fff')) + '</g>';
    const irisEyes = (y, x, col, r = 4.6) => M(C(-x, y, r, col) + C(-x, y, r * .55, INK) + C(-x + 1.2, y - 1.5, 1.3, '#fff'));
    const whiteEyes = (y, x = 10) => M(C(-x, y, 5.8, '#fff')) + eyes(y, x, 3.5);
    const blush = (y, x = 17, cx = 0) => `<g transform="translate(${cx} 0)">` + M(E(-x, y, 4, 2.4, '#ffb3c7', 'opacity=".9"')) + '</g>';
    const smile = (y, w = 4, c = INK) => S(`M${-w} ${y} Q0 ${y + w * .9} ${w} ${y}`, c, 2);
    const star = (x, y, r, fill) => P(`M${f1(x)} ${f1(y - r)} L${f1(x + r * .3)} ${f1(y - r * .3)} L${f1(x + r)} ${f1(y)} L${f1(x + r * .3)} ${f1(y + r * .3)} L${f1(x)} ${f1(y + r)} L${f1(x - r * .3)} ${f1(y + r * .3)} L${f1(x - r)} ${f1(y)} L${f1(x - r * .3)} ${f1(y - r * .3)}Z`, fill);

    /* ---------- 네발 동물 · 포유류 (앉은 모습) ---------- */
    function earQ(t, hc, m, ie, o){
      const ec = o.ec || m, L = ol(ec);
      switch (t){
        case 'tri':   return M(P(`M-24 ${hc - 6} L-21 ${hc - 36} L-5 ${hc - 19}Z`, ec, L) + P(`M-19 ${hc - 13} L-18 ${hc - 29} L-10 ${hc - 18}Z`, ie));
        case 'cat':   return M(P(`M-23 ${hc - 8} L-20 ${hc - 31} L-7 ${hc - 18}Z`, ec, L) + P(`M-19 ${hc - 13} L-18 ${hc - 25} L-11 ${hc - 17}Z`, ie));
        case 'tuft':  return earQ('cat', hc, m, ie, o) + M(S(`M-20 ${hc - 31} L-21 ${hc - 40}`, INK, 2.2));
        case 'round': return M(C(-19, hc - 17, 9, ec, L) + C(-19, hc - 17, 5, ie));
        case 'small': return M(C(-17, hc - 18, 6, ec, L) + C(-17, hc - 18, 3.2, ie));
        case 'big':   return M(C(-22, hc - 15, 13, ec, L) + C(-22, hc - 15, 8, ie));
        case 'long':  return M(`<g ${R(-8, -9, hc - 20)}>${E(-9, hc - 34, 6.5, 17, ec, L) + E(-9, hc - 33, 3.5, 12, ie)}</g>`);
        case 'kanga': return M(`<g ${R(-14, -12, hc - 20)}>${P(`M-17 ${hc - 16} Q-16 ${hc - 46} -10 ${hc - 46} Q-5 ${hc - 40} -6 ${hc - 18}Z`, ec)}</g>`);
        case 'horse': return M(P(`M-17 ${hc - 13} Q-21 ${hc - 33} -10 ${hc - 28} Q-9 ${hc - 20} -10 ${hc - 15}Z`, ec, L) + P(`M-15 ${hc - 16} Q-17 ${hc - 28} -12 ${hc - 25}Z`, ie));
        case 'side':  return M(E(-27, hc - 9, 10, 5, ec, R(-22, -27, hc - 9) + ' ' + L) + E(-27, hc - 9, 6, 2.6, ie, R(-22, -27, hc - 9)));
        case 'pig':   return M(P(`M-22 ${hc - 8} L-25 ${hc - 29} L-8 ${hc - 18}Z`, ec) + P(`M-20 ${hc - 12} L-22 ${hc - 24} L-12 ${hc - 17}Z`, ie));
        case 'pointy':return M(P(`M-21 ${hc - 4} L-29 ${hc - 40} L-6 ${hc - 19}Z`, ec, L) + P(`M-19 ${hc - 10} L-25 ${hc - 32} L-11 ${hc - 18}Z`, ie));
        case 'tiny':  return M(C(-15, hc - 18, 4.5, ec));
        case 'mon':   return M(C(-25, hc, 7, ec, L) + C(-25, hc, 4, ie));
        case 'fold':  return M(P(`M-22 ${hc - 10} Q-25 ${hc - 25} -12 ${hc - 20} Q-14 ${hc - 12} -22 ${hc - 6}Z`, o.ec || shade(m, -.25)));
        case 'huge':  return '';      // 사막여우 큰 귀는 머리 뒤 (아래 qBack)
        default: return '';
      }
    }
    function muzQ(t, hc, o, m, s){
      const y = hc + 9, n = o.n || INK;
      switch (t){
        case 'cat':   return P(`M-3.2 ${y - 1} H3.2 L0 ${y + 2}Z`, o.n || '#ff8fa8') + S(`M-5 ${y + 4} Q-2.5 ${y + 6.5} 0 ${y + 3} Q2.5 ${y + 6.5} 5 ${y + 4}`, INK, 1.8);
        case 'dog':   return E(0, y + 2, 11, 8, s) + E(0, y - 1, 4.6, 3.3, n) + S(`M0 ${y + 2} V${y + 5} M-4 ${y + 6} Q0 ${y + 9} 4 ${y + 6}`, INK, 1.8);
        case 'bear':  return E(0, y + 2, 10, 7.5, s) + E(0, y - 1, 4, 3, n) + S(`M-3.5 ${y + 5} Q0 ${y + 8} 3.5 ${y + 5}`, INK, 1.8);
        case 'long':  return E(0, y + 4, 14, 9.5, s) + M(E(-5, y + 3, 1.7, 2.3, shade(s, -.5))) + S(`M-5 ${y + 9} Q0 ${y + 11} 5 ${y + 9}`, INK, 1.8);
        case 'pig':   return E(0, y + 2, 8.5, 6.5, o.sn || shade(m, -.12)) + M(E(-3, y + 2, 1.5, 2.3, shade(m, -.5))) + smile(y + 10, 3);
        case 'trunk': return S(`M0 ${y - 4} Q-1 ${y + 12} 9 ${y + 17}`, shade(m, -.22), 11.5) + S(`M0 ${y - 4} Q-1 ${y + 12} 9 ${y + 17}`, m, 9) + E(10, y + 17, 4.5, 4, shade(m, -.1)) + smile(y + 1, 3);

  // ---------- 저금 목표: 아직 안 지은 동물 집 (직접 고르거나, 가장 싼 집) ----------
  // 의도: "목표까지 ⭐ 23/60" 처럼 모으는 재미. 다 지으면 막대가 사라짐 (다음 큰 목표를 추가할 자리)
  function goalHab(){
    const left = HABS.filter(h => !habBuilt(h.id)); if (!left.length) return null;
    const g = store.get('goal', null);
    return left.find(h => h.id === g) || left.slice().sort((a, b) => a.cost - b.cost)[0];
  }
  const goalText = (g) => stars >= g.cost ? t('goal.ready', { name:t('hab.' + g.id) }) : t('goal.left', { name:t('hab.' + g.id), n:g.cost - stars });
  HAB_READY = true;
  function refreshGoal(){
    if (!HAB_READY) return;

    bar.hidden = !g; pill.classList.toggle('ready', !!g && stars >= g.cost);
    if (!g) return;
    $('#goalFill').style.width = Math.min(100, stars / g.cost * 100).toFixed(1) + '%';
    $('#goalIc').textContent = g.icon;
  }
  $('#goalPill').addEventListener('click', () => {
    ac(); const g = goalHab();
    if (!g){ sfx.tap(); return; }

    if (stars >= g.cost){ roomTab = 'room'; roomHouse = g.id; selPet = null; renderRoom(); show('room'); }
  });
  const eggName = () => t(petState.egg.special ? 'pet.specialEgg' : petState.egg.feat ? 'pet.featEgg' : 'pet.eggCard');
  function renderRoom(){
    const pets = allPets(), pal = companion();
    if ((selPet !== 'egg' && !selectedPet()) || (selPet === 'egg' && !petState.egg)) selPet = pal ? pal.id : (petState.egg ? 'egg' : null);
    if (roomHouse !== 'home' && !habOf(roomHouse)) roomHouse = 'home';
    $('#roomTabs').innerHTML = ['friends', 'dress', 'room'].map(k => `<button class="tab ${k === roomTab ? 'active' : ''}" data-tab="${k}">${t('ptab.' + k)}</button>`).join('');
    const sp = selectedPet(), house = roomTab === 'room' && roomHouse !== 'home' ? habOf(roomHouse) : null;
    // 위쪽 장면: 방 꾸미기 = 방 전체(또는 동물 집)와 펫들 / 나머지 = 고른 펫을 크게
    let scene = `<svg viewBox="0 0 400 260" aria-hidden="true">${roomBG()}</svg>`;
    if (house){
      scene = habScene(house);
    } else if (roomTab === 'room'){
      const show = (pal ? [pal] : []).concat(pets.filter(p => p !== pal).reverse()).slice(0, 6);     // 데리고 다니는 펫 + 최근 친구들 (최대 6)
      const spots = show.map((p, i) => `<button class="room-pet" data-pid="${p.id}">${petArt(p)}</button>`);
      if (petState.egg) spots.push(`<button class="room-pet" data-pid="egg">${eggNow()}</button>`);
      const w = Math.min(22, 96 / Math.max(1, spots.length)), x0 = 50 - spots.length * w / 2;
      scene += spots.map((h, i) => h.replace('class="room-pet"', `class="room-pet" style="left:${(x0 + i * w).toFixed(1)}%;width:${w.toFixed(1)}%"`)).join('');
    } else if (roomTab === 'dress' && !sp){
      scene += `<div class="room-empty">${t('pet.noPet')}</div>`;
    } else {
      const art = sp ? petArt(sp) : (selPet === 'egg' ? eggNow() : '');
      if (art) scene += `<button class="room-pet big" data-pid="${sp ? sp.id : 'egg'}">${art}</button>`;
      if (sp) scene += `<div class="stage-name">${esc(petName(sp))} <small>${esc(petTitle(sp))} · ${t('pet.stage' + sp.st)}</small></div>`;
      else if (selPet === 'egg') scene += `<div class="stage-name">${eggName()} <small>🥚 ${petState.egg.p}/${PET_CFG.hatch}</small></div>`;
    }
    if (!pets.length && roomTab !== 'friends' && !house) scene += `<div class="room-empty">${t('room.empty')}</div>`;
    $('#roomScene').innerHTML = scene;
    $('#roomScene').classList.toggle('hab', !!house);
    // 도구 줄
    let tools = '';
    if (roomTab === 'friends' && sp){
      const on = pal && pal.id === sp.id, lv = loveOf(sp), fed = sp.fed === todayKey();
      tools = `<input id="petNameIn" maxlength="10" value="${esc(sp.name || '')}" placeholder="${esc(petName(sp))}" aria-label="${esc(t('pet.namePh'))}">` +
              `<button class="pal-btn ${on ? 'on' : ''}" id="palBtn">${on ? '✓ ' + t('pet.palNow') : '🐾 ' + t('pet.palBtn')}</button>` +
              `<div class="treat-row">${heartsHTML(sp)}` +
              (lv >= LOVE_MAX ? `<button class="treat-btn trick" id="treatBtn">✨ ${t('pet.trickBtn')}</button>`
                : fed ? `<span class="treat-wait">${t('pet.fedToday')}</span>` : `<button class="treat-btn" id="treatBtn">${t('pet.treat')}</button>`) +
              `<small>${lv >= LOVE_MAX ? t('trick.' + trickOf(sp)) : t('pet.loveHint')}</small></div>` +
              (sp.st >= 2 ? `<div class="look-row"><span>${t('pet.look')}</span>${[1, 2, 3].map(n => n <= sp.st
                  ? `<button class="look-btn ${shownSt(sp) === n ? 'on' : ''}" data-look="${n}">${petArt(Object.assign({}, sp, { look:n, st:n === 3 ? sp.st : Math.max(n, 1), wear:{} }))}<b>${t('look.' + n)}</b></button>`
                  : `<span class="look-btn lock">🔒<b>${t('look.' + n)}</b></span>`).join('')}</div>` : '');
    } else if (roomTab === 'friends' && selPet === 'egg'){
      tools = `<p>${eggLine()}</p>`;
    } else if (roomTab === 'dress' && pets.length > 1){
      tools = `<div class="pet-strip">${pets.map(p => `<button class="${sp && sp.id === p.id ? 'on' : ''}" data-pid="${p.id}">${petArt(p)}</button>`).join('')}</div>`;

        return `<button class="item ${sp && sp.id === p.id ? 'equipped' : ''} ${isRare(p) ? 'shinyc' : ''}" data-pid="${p.id}">
          ${lv ? `<i class="lv">${lv >= LOVE_MAX ? '✨' : '♥' + lv}</i>` : ''}
          <div class="thumb">${petArt(p)}</div><span class="name">${esc(petName(p))}</span><span class="tag">${on ? '🐾 ' + t('pet.palNow') : t('pet.stage' + p.st)}</span></button>`;
      }).join('');
      if (petState.egg) grid += `<button class="item egg-card ${selPet === 'egg' ? 'equipped' : ''}" data-pid="egg"><div class="thumb">${eggNow()}</div>
          <span class="name">${eggName()}</span><span class="tag">🥚 ${petState.egg.p}/${PET_CFG.hatch}</span></button>`;
    } else if (roomTab === 'dress'){
      if (sp) grid = Object.keys(PET_ITEMS).map(id => {
        const it = PET_ITEMS[id], has = petOwned.includes(id), on = (sp.wear || {})[it.slot] === id;
        return `<button class="item ${on ? 'equipped' : ''} ${has ? '' : 'locked'}" data-id="${id}">
          <div class="thumb">${petArt(Object.assign({}, sp, { st:3, wear:{ [it.slot]:id } }))}</div>
          <span class="name">${t('pitem.' + id)}</span><span class="tag">${on ? t('closet.wearing') : has ? t('closet.owned') : '⭐ ' + it.cost}</span></button>`;
      }).join('');
    } else if (house){
      const built = habBuilt(house.id);
      grid = (HAB_DECO[house.id] || []).map(d => {
        const has = hab.deco.includes(d.id), on = has && !hab.off.includes(d.id);
        return `<button class="item ${on ? 'equipped' : ''} ${has ? '' : 'locked'}" data-deco="${d.id}">
          <div class="thumb">${decoThumb(d)}</div>
          <span class="name">${t('hab.d.' + d.id)}</span><span class="tag">${on ? t('room.placed') : has ? t('closet.owned') : built ? '⭐ ' + d.cost : '🔒'}</span></button>`;
      }).join('');
    } else {
      const ids = Object.keys(ROOM).sort((a, b) => ROOM_ORDER.indexOf(ROOM[a].slot) - ROOM_ORDER.indexOf(ROOM[b].slot) || ROOM[a].cost - ROOM[b].cost);
      grid = ids.map(id => {
        const has = roomOwned.includes(id), on = roomOn[ROOM[id].slot] === id;
        return `<button class="item ${on ? 'equipped' : ''} ${has ? '' : 'locked'}" data-id="${id}">
          <div class="thumb">${roomThumb(id)}</div>
          <span class="name">${t('room.' + id)}</span><span class="tag">${on ? t('room.placed') : has ? t('closet.owned') : '⭐ ' + ROOM[id].cost}</span></button>`;
      }).join('');
    }
    $('#roomGrid').innerHTML = grid;
  }
  function roomPlace(id, on){
    const sl = ROOM[id].slot;
    if (on) roomOn[sl] = id; else if (sl !== 'wall') delete roomOn[sl];
    store.set('roomOn', roomOn); sfx.equip(); renderRoom();
  }
  const savePets = () => { store.set('pet', petState); renderPets(); };
  function buyThing(card, cost, name, iconSVG, done){
    if (stars < cost){ sfx.nope(); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); toast(t('closet.needMore', { n:cost - stars })); return; }
    dialog({ icon:`<div style="width:110px;height:84px;margin:auto">${iconSVG.replace('<svg ', '<svg style="width:100%;height:100%" ')}</div>`,
      text:t('closet.buyQ', { cost, item:name }), ok:t('closet.buyOk'), cancel:t('closet.buyCancel'),
      onOk(){ setStars(stars - cost); sfx.buy(); confetti(30); done(); } });
  }
  function pickPet(pid){
    selPet = pid; ac(); tone(784, .08, 'sine', .1);
    const p = selectedPet();

    renderRoom();
  }
  $('#roomTabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; roomTab = b.dataset.tab; sfx.tap(); renderRoom(); });
  function feedPet(){
    const p = selectedPet(); if (!p) return;
    const stg = () => $('#roomScene .room-pet.big');
    if (loveOf(p) >= LOVE_MAX){ playTrick(stg(), p); const m = trickLine(p); toast(m); Voice.play('pet.say', m); return; }
    if (p.fed === todayKey()) return;
    if (stars < 1){ sfx.nope(); toast(t('closet.needMore', { n:1 })); return; }
    setStars(stars - 1); p.love = loveOf(p) + 1; p.fed = todayKey(); savePets();
    [523, 659, 784].forEach((f, i) => tone(f, .09, 'sine', .1, i * .1));                       // 냠냠
    renderRoom(); heartsBurst($('#roomScene'), 4);
    if (p.love >= LOVE_MAX){
      setTimeout(() => { playTrick(stg(), p); confetti(40); const m = t('pet.trickLearn', { name:petName(p), trick:t('trick.' + trickOf(p)) }); toast(m); Voice.play('pet.say', m); }, 450);
    } else { hopEl(stg()); const m = t('pet.yum') + ' ' + t('pet.loveUp', { name:petName(p), h:p.love }); toast(m); Voice.play('pet.say', m); }
  }
  function decoTap(id, card){
    const d = DECO[id]; if (!d) return;
    if (!habBuilt(d.hab)){ sfx.nope(); toast(t('hab.buildFirst')); Voice.play('hab', t('hab.buildFirst')); return; }
    if (!hab.deco.includes(id)) return buyThing(card, d.cost, t('hab.d.' + id), decoThumb(d), () => { hab.deco.push(id); saveHab(); renderRoom(); });
    hab.off = hab.off.includes(id) ? hab.off.filter(x => x !== id) : hab.off.concat(id); saveHab(); sfx.equip(); renderRoom();
  }
  $('#petTools').addEventListener('click', (e) => {
    const hc = e.target.closest('[data-house]');
    if (hc){                                                             // 집 고르기
      roomHouse = hc.dataset.house; habPage = 0; sfx.tap(); renderRoom();
      const h = habOf(roomHouse);
      Voice.play('hab', h ? t('hab.' + h.id) + '. ' + (habBuilt(h.id) ? t('hab.count', { n:habPets(h).length }) : t('hab.who.' + h.id)) : t('hab.home'));
      const on = $('#petTools .h-chip.on'); if (on) on.scrollIntoView({ inline:'center', block:'nearest' });
      return;
    }
    if (e.target.closest('#treatBtn')){ feedPet(); return; }
    const lb = e.target.closest('[data-look]');
    if (lb){                                                             // 모습 고르기 (자란 단계는 그대로)
      const p = selectedPet(), n = +lb.dataset.look; if (!p || n > p.st) return;
      if (n === p.st) delete p.look; else p.look = n;                    // 지금 단계 = 따로 기억 안 함 → 자라면 새 모습을 따라감
      savePets(); sfx.equip(); renderRoom(); renderPets();
      const msg = t('pet.lookSet', { name:petName(p), look:t('look.' + n) }); toast(msg); Voice.play('pet.say', msg);
      return;

    const sb = e.target.closest('[data-pid]'); if (sb){ pickPet(sb.dataset.pid); return; }
    if (e.target.closest('#palBtn')){

    if (card.dataset.deco){ decoTap(card.dataset.deco, card); return; }
    const id = card.dataset.id;
    if (roomTab === 'dress'){
      const p = selectedPet(), it = PET_ITEMS[id]; if (!p || !it) return;
      const wearIt = () => { p.wear = Object.assign({}, p.wear, { [it.slot]:id }); savePets(); renderRoom(); };
      if (!petOwned.includes(id)) return buyThing(card, it.cost, t('pitem.' + id), petArt(Object.assign({}, p, { st:3, wear:{ [it.slot]:id } })),
