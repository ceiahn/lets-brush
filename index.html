<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8fd3ff" />
<!-- v0.24 홈 화면 앱(PWA): 웹 주소(https)로 열 때만 동작. 파일로 바로 열면 그냥 무시됨 -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Let's Brush" />
<title>Let's Brush</title>
<!--
  Let's Brush (렛츠 브러시)  버전: v0.36.0  |  2026-10-27
  개발 안내 · 규칙 · 변경 기록은 docs/개발_인수인계.md 에 있음 (새로 이어서 작업한다면 그 파일부터 읽을 것)
  파일 나눔 (v0.36.0~): 이 파일 = 화면(HTML)만 · 모양 = css/app.css · 동작 = js/ 폴더 (아래 순서대로 읽힘, 순서 바꾸지 말 것)
-->
<!-- v0.33.0 글꼴은 앱 안에 (fonts/ 폴더). 구글 폰트 서버로 접속하지 않음 → 아이 정보 보호 · 인터넷 없어도 같은 글꼴 -->
<link href="fonts/jua.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
</head>
<body>
<!-- HTML 안내: 화면(section.screen)마다 하나. 글자는 data-i18n="키"로 넣어 두면 applyLang()이 언어팩 글로 채움.
     양치 화면은 #brushC(클로즈업) 하나 (A·B 화면은 v0.20.1 에서 없앰) -->

<div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div id="fx"></div>

<!-- ① 첫 화면 -->
<section id="home" class="screen active">
  <header class="topbar">
    <div class="tb-left"><button class="pill goal-pill" id="goalPill">⭐ <b class="starNum">0</b><span class="gbar" id="goalBar" hidden><i id="goalFill"></i></span><span id="goalIc"></span></button><button class="pill flame" id="flameBtn" aria-label="Streak">🔥 <b id="flameN">0</b></button></div>
    <div class="right">
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
      <button class="icon-btn soundBtn" aria-label="Sound">🔊</button>
    </div>
  </header>
  <div class="hero">
    <button class="kid-chip" id="kidChip" hidden></button>
    <h1 data-i18n-html="home.title"></h1>
    <p class="event-badge" id="homeEvent" hidden></p>
    <div class="pet-wrap">
      <button class="stage home-stage" id="homeStage" aria-label="Dress up"><div class="char-wrap" id="homeChar"></div></button>
      <button class="pet-spot egg-spot" id="homeEgg" aria-label="Egg" hidden></button>
      <button class="pet-spot pal-spot" id="homePal" aria-label="Pet" hidden></button>
      <button class="pal-change" id="palChange" hidden>🐾 <span data-i18n="pet.palChange"></span></button>
      <div class="pet-bub" id="petBub"></div>
    </div>
    <p class="today" id="todayText"></p>
  </div>
  <div class="bottom">
    <button class="quiz-pill" id="quizHome" hidden></button>
    <button class="big-btn" id="startBtn" data-i18n="home.start"></button>
    <div class="menu-row">
      <button class="menu-btn closetBtn"><span class="mi">👕</span><span data-i18n="menu.closet"></span></button>
      <button class="menu-btn" id="roomBtn"><span class="mi">🏠</span><span data-i18n="menu.room"></span></button>
      <button class="menu-btn" id="bookBtn"><span class="mi">📖</span><span data-i18n="menu.book"></span></button>
      <button class="menu-btn" id="mapBtn"><span class="mi">🗺️</span><span data-i18n="menu.map"></span><i class="mbadge" id="mapBadge"></i></button>
    </div>
    <button class="ver" id="ver">v0.36.0</button>
  </div>
</section>

<!-- ② 꾸미기 화면 -->
<section id="closet" class="screen">
  <header class="topbar">
    <button class="icon-btn backBtn" aria-label="Back">←</button>
    <div class="title-sm" data-i18n="closet.title"></div>
    <div class="pill">⭐ <b class="starNum">0</b></div>
  </header>
  <div class="stage closet-stage"><div class="char-wrap" id="closetChar"></div></div>
  <p class="event-badge" id="closetEvent" hidden></p>
  <div class="closet-panel">
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- ②-2 도감 -->
<section id="book" class="screen">
  <header class="topbar">
    <button class="icon-btn backBtn" aria-label="Back">←</button>
    <div class="title-sm" data-i18n="book.title"></div>
    <div class="pill"><b id="bookCount">0</b></div>
  </header>
  <div class="closet-panel">
    <div class="tabs" id="bookTabs"></div>
    <div class="grid" id="bookGrid"></div>
    <p class="book-tip" id="bookTip"></p>
  </div>
</section>

<!-- ②-3 펫 방 -->
<section id="room" class="screen">
  <header class="topbar">
    <button class="icon-btn backBtn" aria-label="Back">←</button>
    <div class="title-sm" data-i18n="room.title"></div>
    <div class="pill">⭐ <b class="starNum">0</b></div>
  </header>
  <div class="room-scene" id="roomScene"></div>
  <div class="closet-panel">
    <div class="tabs" id="roomTabs"></div>
    <div class="pet-tools" id="petTools" hidden></div>
    <div class="grid" id="roomGrid"></div>
  </div>
</section>

<!-- ②-4 모험 지도 -->
<section id="map" class="screen">
  <header class="topbar">
    <button class="icon-btn backBtn" aria-label="Back">←</button>
    <div class="title-sm" data-i18n="map.title"></div>
    <div class="spacer"></div>
  </header>
  <div class="map-chips" id="mapChips"></div>
  <div class="map-scene" id="mapScene"></div>
  <p class="map-left" id="mapLeft"></p>
  <div class="map-reward" id="mapReward"></div>
  <p class="map-how" id="mapHow"></p>
</section>

<!-- ③ 설정 화면 -->
<section id="settings" class="screen">
  <header class="topbar">
    <button class="icon-btn backBtn" aria-label="Back">←</button>
    <div class="title-sm" data-i18n="settings.title"></div>
    <div class="spacer"></div>
  </header>
  <div class="set-scroll">
    <div class="set-card">
      <label class="set-row"><span data-i18n="settings.language"></span><select id="langSel"></select></label>
      <div class="set-sub" data-i18n="settings.packs"></div>
      <div id="packList"></div>
    </div>
    <div class="set-card">
      <label class="set-row"><span data-i18n="settings.country"></span><select id="countrySel"></select></label>
      <p class="set-note" id="eventNote"></p>
    </div>
    <div class="set-card">
      <label class="set-row"><span data-i18n="settings.voice"></span><input type="checkbox" class="tgl" id="voiceTgl"></label>
      <label class="set-row"><span data-i18n="settings.voicePick"></span><select id="voiceSel"></select></label>
      <label class="set-row"><span data-i18n="settings.voiceTone"></span><select id="toneSel"></select></label>
      <button class="listen-btn" id="voiceTry" data-i18n="settings.voiceTry"></button>
    </div>
    <div class="set-card">
      <div class="set-sub" data-i18n="rec.title"></div>
      <p class="set-note" data-i18n="rec.note"></p>
      <div class="rec-list" id="recList"></div>
      <p class="set-note" data-i18n="settings.voiceNote"></p>
    </div>
    <div class="set-card">
      <label class="set-row"><span data-i18n="audio.music"></span><input type="checkbox" class="tgl ap-music"></label>
      <label class="set-row"><span data-i18n="audio.track"></span><select class="ap-bgm"></select></label>
      <button class="listen-btn" id="bgmTry" data-i18n="audio.preview"></button>
      <button class="listen-btn" id="bgmLoad" data-i18n="audio.load"></button>
      <p class="file-name" id="bgmName"></p>
      <label class="set-row"><span data-i18n="audio.sfx"></span><input type="checkbox" class="tgl ap-sfx"></label>
    </div>
    <div class="set-card">
      <label class="set-row"><span data-i18n="settings.eventLook"></span><input type="checkbox" class="tgl" id="eventTgl"></label>
    </div>
    <div class="set-card" id="subCard" hidden>
      <div class="set-sub" data-i18n="sub.title"></div>
      <p class="sub-st" id="subSt"></p>
      <p class="set-note" id="subPerks"></p>
      <button class="listen-btn" id="subGo"></button>
      <div class="sub-btns"><button class="text-btn" id="subRestore" data-i18n="sub.restore"></button><button class="text-btn" id="subManage" data-i18n="sub.manage"></button></div>
      <p class="set-note" data-i18n="sub.keep"></p>
    </div>
    <div class="set-card" id="kidCard">
      <div class="set-sub" data-i18n="kids.title"></div>
      <div class="kid-rows" id="kidRows"></div>
      <button class="listen-btn" id="kidAdd" data-i18n="kids.add"></button>
      <p class="set-note" data-i18n="kids.note"></p>
    </div>
    <div class="set-card">
      <div class="set-sub" data-i18n="settings.parentTitle"></div>
      <label class="set-row"><span data-i18n="settings.dur"></span><select id="durSel"></select></label>
      <label class="set-row"><span data-i18n="settings.technique"></span><select id="techSel"></select></label>
      <label class="set-row"><span data-i18n="settings.hand"></span><select id="handSel"></select></label>
      <label class="set-row"><span data-i18n="settings.kidName"></span><input id="nameIn" maxlength="12" autocomplete="off" style="font:inherit;font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid #d6e9f7;width:52%"></label>
      <div class="set-row"><span data-i18n="settings.bday"></span><span class="bday-sels"><select id="bdayY"></select><select id="bdayM"></select><select id="bdayD"></select></span></div>
      <p class="set-note" id="ageNote"></p>
      <label class="set-row" id="ageRow"><span data-i18n="settings.age"></span><select id="ageSel"></select></label>
      <label class="set-row"><span data-i18n="settings.tongue"></span><input type="checkbox" class="tgl" id="tongueTgl"></label>
      <label class="set-row"><span data-i18n="settings.theater"></span><input type="checkbox" class="tgl" id="theaterTgl"></label>
      <label class="set-row"><span data-i18n="settings.quiz"></span><input type="checkbox" class="tgl" id="quizTgl"></label>
      <label class="set-row"><span data-i18n="settings.special"></span><input type="checkbox" class="tgl" id="specialTgl"></label>
      <button class="listen-btn" id="spLoad" data-i18n="sp.load"></button>
      <p class="file-name" id="spInfo"></p>
      <button class="listen-btn" id="spClear" data-i18n="sp.clear" hidden></button>
      <label class="set-row"><span data-i18n="settings.prep"></span><input type="checkbox" class="tgl" id="prepTgl"></label>
      <p class="set-note" id="techNote"></p>
      <p class="set-note" data-i18n="settings.parentTip"></p>
      <p class="set-note" data-i18n="settings.medNote"></p>
      <p class="set-note legal-links" id="legalLinks"></p>
      <div class="set-sub" data-i18n="week.title"></div>
      <div class="week" id="weekBox"></div>
    </div>
    <div class="set-card">
      <div class="set-sub" data-i18n="bk.title"></div>
      <p class="set-note" data-i18n="bk.note"></p>
      <button class="listen-btn" id="bkSave" data-i18n="bk.save"></button>
      <button class="listen-btn" id="bkLoad" data-i18n="bk.load"></button>
      <p class="file-name" id="bkInfo"></p>
      <p class="set-note bk-warn" id="bkWarn" hidden></p>
    </div>
    <div class="set-card dev">
      <div class="set-sub" data-i18n="settings.devTitle"></div>
      <label class="set-row"><span data-i18n="settings.eventPreview"></span><select id="evSel"></select></label>
      <button class="listen-btn" id="petTest" data-i18n="settings.petTest"></button>
      <button class="listen-btn" id="mapTest" data-i18n="settings.mapTest"></button>
      <button class="listen-btn" id="eggTest" data-i18n="settings.eggTest"></button>
      <button class="listen-btn" id="star100" data-i18n="settings.star100"></button>
      <button class="listen-btn" id="bookAll" data-i18n="settings.bookAll"></button>
      <button class="listen-btn" id="petAll" data-i18n="settings.petAll"></button>
      <button class="listen-btn" id="heroAll" data-i18n="settings.heroAll"></button>
      <button class="listen-btn" id="theaterTest" data-i18n="settings.theaterTest"></button>
      <button class="listen-btn" id="specialTest" data-i18n="settings.specialTest"></button>
      <button class="listen-btn" id="subSim"></button>
      <button class="listen-btn" id="subEnd" data-i18n="sub.devEnd"></button>
      <button class="listen-btn" id="subAct" data-i18n="sub.devAct"></button>
      <button class="listen-btn" id="subReset" data-i18n="sub.devReset"></button>
      <button class="listen-btn" id="resetAll" data-i18n="settings.reset"></button>
    </div>
  </div>
</section>

<!-- ④-C 양치 화면 C: 클로즈업 -->
<section id="brushC" class="screen brushC">
  <div class="c-cam" id="cCam">
    <svg id="cScene" viewBox="-60 40 1120 640" preserveAspectRatio="xMinYMin meet" aria-hidden="true"></svg>
    <div class="c-bclip"><div class="c-bpose"><div class="c-travel"><div class="c-scrub"><svg class="c-bsvg" viewBox="-95 -75 750 105" aria-hidden="true"></svg></div></div></div></div>
    <svg id="cOver" viewBox="-60 40 1120 640" preserveAspectRatio="xMinYMin meet" aria-hidden="true"></svg>
    <div class="c-germs"></div>
    <div class="c-foam"></div>
    <div class="c-pops"></div>
  </div>
  <div class="c-top">
    <button class="icon-btn soundBtn" aria-label="Sound">🔊</button>
    <div class="c-track">
      <div class="c-fill"></div>
      <i class="c-mark" style="left:25%"></i><i class="c-mark" style="left:50%"></i><i class="c-mark" style="left:75%"></i><i class="c-mark" style="left:100%"></i>
      <div class="c-pill js-time">2:00</div>
    </div>
    <button class="icon-btn js-pause" aria-label="Pause"></button>
    <button class="icon-btn js-stop" aria-label="Stop"></button>
  </div>
  <div class="c-zone js-zoneName"></div>
  <div class="c-tech js-tech"></div>
  <div class="c-rider"><div class="c-say js-say"></div><div class="char-wrap" id="brushCharC"></div></div>
</section>

<!-- ④-0 양치 전 준비: 치약 짜기 -->
<section id="prep" class="screen">
  <div class="prep-card">
    <span class="prep-step" data-i18n="prep.step"></span>
    <div class="prep-title" id="prepTitle"></div>
    <div class="prep-scene" id="prepScene"></div>
    <div class="prep-compare" id="prepCompare"></div>
    <div class="prep-tips" id="prepTips"></div>
    <button class="listen-btn" id="prepListen" data-i18n="prep.listen"></button>
    <p class="prep-note" id="prepNote"></p>
  </div>
  <button class="big-btn" id="prepGo" data-i18n="prep.go"></button>
  <button class="text-btn" id="prepBack" data-i18n="brush.back"></button>
</section>

<!-- ④-3 반짝이 극장: 양치가 끝나면 짧은 만화 (v0.21.0) -->
<section id="theater" class="screen">
  <div class="th-head" id="thHead"></div>
  <div class="th-stage" id="thStage"></div>
  <button class="th-skip" id="thSkip" data-i18n="th.skip"></button>
</section>

<!-- ④-4 스페셜 영상: 특별한 날 · 일주일에 한 번 (v0.22.0) -->
<section id="special" class="screen">
  <div class="th-head" id="spHead"></div>
  <div class="sp-stage" id="spStage">
    <video id="spVideo" playsinline webkit-playsinline preload="auto"></video>
    <div class="th-cur l"></div><div class="th-cur r"></div>
    <div class="th-title" id="spTitle"></div>
    <div class="sp-part" id="spPart"></div>
  </div>
  <button class="th-skip sp-sound" id="spSound" data-i18n="sp.sound" hidden></button>
  <button class="th-skip" id="spSkip" data-i18n="th.skip"></button>
</section>

<!-- ④-2 보너스: 혀 닦기 -->
<section id="tongue" class="screen">
  <div class="tg-title" data-i18n="tongue.title"></div>
  <div class="tg-stage" id="tgStage"></div>
  <div class="tg-count" id="tgCount"><i></i><i></i><i></i></div>
  <div class="tg-say" id="tgSay"></div>
  <p class="tg-tip" data-i18n="tongue.tip"></p>
  <button class="text-btn" id="tgSkip" data-i18n="tongue.skip"></button>
</section>

<!-- ⑤ 완료 화면 -->
<section id="done" class="screen">
  <div class="done-l">
  <div class="done-head"><div class="pill star-pill" id="donePill">⭐ <b id="doneCount">0</b></div></div>
  <h2 data-i18n="done.title"></h2>
  <div class="spit-pill" id="doneSpit"></div>
  <div class="gift-stage" id="giftStage">
    <div class="rays"></div>
    <div class="germ-badge" id="doneGerms" hidden></div>
    <div class="stamp" id="stampMark"></div>
    <div class="char-wrap" id="doneChar"></div>
    <button class="gift" id="giftBox" aria-label="Open">
      <svg class="gbody" viewBox="0 0 100 70" preserveAspectRatio="none"><rect x="4" y="2" width="92" height="66" rx="9" fill="#ff7aa8" stroke="#24324a" stroke-width="3.5"/>
        <circle cx="20" cy="20" r="5" fill="#fff" opacity=".7"/><circle cx="78" cy="48" r="6" fill="#fff" opacity=".7"/><circle cx="26" cy="52" r="4" fill="#fff" opacity=".7"/><circle cx="76" cy="16" r="4" fill="#fff" opacity=".7"/>
        <rect x="42" y="2" width="16" height="66" fill="#ffd54a"/></svg>
      <svg class="glid" viewBox="0 0 110 44" preserveAspectRatio="none"><ellipse cx="40" cy="12" rx="15" ry="10" fill="#ffd54a" stroke="#24324a" stroke-width="2.5"/><ellipse cx="70" cy="12" rx="15" ry="10" fill="#ffd54a" stroke="#24324a" stroke-width="2.5"/>
        <rect x="3" y="18" width="104" height="24" rx="8" fill="#ff8fb4" stroke="#24324a" stroke-width="3"/><rect x="47" y="18" width="16" height="24" fill="#ffd54a"/><circle cx="55" cy="15" r="7" fill="#ffc83d" stroke="#24324a" stroke-width="2.5"/></svg>
    </button>
  </div>
  </div>
  <div class="done-r">
  <p class="gift-hint" id="giftHint" data-i18n="done.gift"></p>
  <ul class="rw-list" id="rwList"></ul>
  <div class="next-row" id="nextRow" hidden>
    <div class="next-card" id="petCard" hidden><div class="pc-art" id="pcArt"></div><p id="pcText"></p><div class="pdots" id="pcDots"></div></div>
    <div class="next-card boss-next" id="bossNext" hidden><div class="pc-art" id="bnArt"></div><p id="bnText"></p></div>
  </div>
  <p id="doneMsg"></p>
  <button class="quiz-pill" id="quizDone" hidden></button>
  <div class="bottom">
    <button class="stamp-btn" id="stampBtn"><span class="sb-txt"><span data-i18n="done.parentTip"></span><small data-i18n="stamp.hold"></small></span></button>
    <div class="done-btns">
      <button class="big-btn" id="homeBtn" data-i18n="done.home"></button>
      <button class="sub-btn closetBtn" data-i18n="done.closet"></button>
    </div>
  </div>
  </div>
</section>

<!-- 알 부화 · 펫 성장 축하 -->
<div class="pet-show" id="petShow">
  <div class="ps-box">
    <div class="ps-stage" id="psStage"></div>
    <p class="ps-title" id="psTitle"></p>
    <label class="ps-name" id="psNameRow" hidden><span data-i18n="pet.nameAsk"></span><input id="psName" maxlength="10" autocomplete="off"></label>
    <button class="big-btn small" id="psOk" data-i18n="pet.ok" hidden></button>
  </div>
</div>

<!-- 대화 창 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="dlg-icon" id="dlgIcon"></div>
    <p id="dlgText"></p>
    <button class="big-btn small" id="dlgOk"></button>
    <button class="text-btn" id="dlgCancel"></button>
  </div>
</div>
<!-- v0.30.0 오늘의 퀴즈: 그날 첫 양치 뒤 한 문제 (나이에 맞게) -->
<div class="modal" id="quiz">
  <div class="modal-box quiz-box" id="quizBox">
    <div class="gate-title" data-i18n="quiz.title"></div>
    <div class="quiz-pic" id="quizPic"></div>
    <p class="quiz-q" id="quizQ"></p>
    <button class="quiz-hear" id="quizHear" aria-label="Listen">🔊</button>
    <div class="quiz-opts" id="quizOpts"></div>
    <p class="quiz-msg" id="quizMsg"></p>
    <div class="quiz-stamps" id="quizStamps"></div>
    <button class="big-btn small" id="quizOk" hidden></button>
    <button class="text-btn" id="quizClose" data-i18n="quiz.close"></button>
  </div>
</div>
<!-- v0.28.5 부모 확인: 설정을 열기 전에 곱셈 문제 -->
<!-- v0.32.0 반짝이 클럽 무료 체험 안내 (부모님께, 첫 실행 · 설정에서) -->
<div class="modal" id="subIntro">
  <div class="modal-box sub-box">
    <div class="sub-who" data-i18n="sub.parent"></div>
    <div class="gate-title" id="subH"></div>
    <ul class="sub-list" id="subList"></ul>
    <p class="set-note" id="subFree"></p>
    <label class="sub-agree"><input type="checkbox" id="subAgree"><span id="subConsent"></span></label>
    <button class="big-btn sub-start" id="subStart"></button>
    <button class="text-btn" id="subLater" data-i18n="sub.later"></button>
    <p class="sub-links" id="subLinks"></p>
  </div>
</div>
<!-- v0.31.0 누가 닦을까요? (아이가 둘 이상일 때 앱을 열면 · 홈의 이름 단추) -->
<div class="modal" id="kidPick">
  <div class="modal-box kid-box">
    <div class="gate-title" data-i18n="kids.who"></div>
    <div class="kid-pick" id="kidPickList"></div>
  </div>
</div>
<div class="modal" id="gate">
  <div class="modal-box gate-box" id="gateBox">
    <div class="gate-title" data-i18n="gate.title"></div>
    <p class="gate-note" id="gateNote"></p>
    <p class="gate-q" id="gateQ"></p>
    <div class="gate-ans" id="gateAns">?</div>
    <div class="gate-pad" id="gatePad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="ok" aria-label="OK">✓</button>
    </div>
    <button class="text-btn" id="gateCancel" data-i18n="gate.cancel"></button>
  </div>
</div>

<!-- 소리 설정 창 -->
<div class="audio-pop" id="audioPop">
  <div class="ap-box">
    <div class="ap-title" data-i18n="audio.title"></div>
    <label class="set-row"><span data-i18n="audio.voice"></span><input type="checkbox" class="tgl ap-voice"></label>
    <label class="set-row"><span data-i18n="audio.music"></span><input type="checkbox" class="tgl ap-music"></label>
    <label class="set-row"><span data-i18n="audio.track"></span><select class="ap-bgm"></select></label>
    <label class="set-row"><span data-i18n="audio.sfx"></span><input type="checkbox" class="tgl ap-sfx"></label>
    <button class="ap-close" id="apClose" data-i18n="audio.close"></button>
  </div>
</div>
<input type="file" id="bgmFile" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg" hidden>
<input type="file" id="bkFile" accept=".json,application/json" hidden>
<input type="file" id="spFile" accept="video/*,.mp4,.webm,.mov,.m4v" multiple hidden>

<div id="toast"></div>
<div id="confetti"></div>
